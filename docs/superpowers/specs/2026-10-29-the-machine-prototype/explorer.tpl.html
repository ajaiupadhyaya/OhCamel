<style>
  :root {

  #results button { display: flex; width: 100%; justify-content: space-between; gap: 10px; padding: 6px 10px; text-align: left; font-size: 13px; }
  #results button:hover, #results button.hi { background: var(--raise2); }
  #results span { font: 11px var(--mono); color: var(--dim); white-space: nowrap; }

  .vdetail { font: 11.5px/1.5 var(--mono); color: var(--dim); }

  .sec { margin-top: 14px; }

  .chip sub { color: var(--dim); font-size: 10px; margin-left: 4px; vertical-align: 0; }

  .chip.more { color: var(--dim); }

  table.kv td.n { text-align: right; color: #fff; }

  table.kv tr.hd td { color: var(--dim); font-size: 11px; }

<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<header>
  <span class="brand">OhCamel</span>
  <nav class="seg" id="views">
    <a class="on" href="#">machine</a><a href="#">markets</a><a href="#">risk</a><a href="#">portfolios</a><a href="#">research</a><a href="#">volatility</a><a href="#">rates</a><a href="#">companies</a><a href="#">desk</a>
  </nav>
  <div class="seg" id="webmode">
    <button data-m="both" class="on">web</button><button data-m="up">reads</button><button data-m="down">feeds</button><button data-m="none">no web</button>
  </div>
  <div class="search"><input id="q" placeholder="find a ticker, job, model, strategy" autocomplete="off" spellcheck="false"><div id="results"></div></div>
  <div class="status">WED 28 OCT · 11:15 PM ET · market closed</div>
</header>

<aside id="focus" class="panel"></aside>

<aside id="side" class="panel">
  <div class="tabs">
    <button data-t="tour" class="on">Tour</button><button data-t="read">Reading</button><button data-t="day">The day</button>
    <span class="sp" id="tabhint">scroll ↓</span>
  </div>
  <div class="pane on" id="p-tour"></div>
  <div class="pane" id="p-read"><p class="dim">Click anything in the machine, or search for it, to read what it is and what it did.</p></div>
  <div class="pane" id="p-day"></div>
</aside>

<div id="legend">
  <span><i class="sw sel"></i>selected</span><span><i class="sw up"></i>what it reads</span><span><i class="sw down"></i>what it feeds</span><span><i class="sw fail"></i>failed a gate</span><span>drag to turn · click to select</span>
</div>
<div id="tip"></div>

<script id="graph" type="application/json">__GRAPH__</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const G = JSON.parse(document.getElementById("graph").textContent);

const outE = N.map(() => []), inE = N.map(() => []);

const $ = s => document.querySelector(s);

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const num = (x, d = 0) => x == null ? "—" : Number(x).toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d });
const tET = iso => iso ? new Date(iso).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) : "—";
const dShort = iso => iso ? new Date(iso.length <= 10 ? iso + "T12:00:00Z" : iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", timeZone: "America/New_York" }) : "—";
const hh = h => { const m = Math.round((h % 1) * 60), H = Math.floor(h) % 24; return `${(H % 12) || 12}:${String(m).padStart(2, "0")} ${H < 12 ? "AM" : "PM"}`; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ------------------------------------------------------------------ geometry: rings narrowing to the book
const HGT = r => 0.34 * r;
const pos = n => new THREE.Vector3(n.r * Math.sin(n.a), HGT(n.r), -n.r * Math.cos(n.a));
const P = N.map(pos);
const isTrack = n => n.k === "series" && n.m.track !== "daily" && n.m.track !== "macro" && n.m.track !== "factors" && n.m.track !== "13f";

const canvas = $("#gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
const PR = Math.min(devicePixelRatio, 2);

// structure: the rings, the clock's hours and every scheduled fire
{

  for (let h = 0; h < 24; h++) { const a = h / 24 * Math.PI * 2, r0 = 4.25, r1 = h % 6 ? 4.42 : 4.6; v.push(r0 * Math.sin(a), HGT(r0), -r0 * Math.cos(a), r1 * Math.sin(a), HGT(r0), -r1 * Math.cos(a)); }
  const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(v, 3));
  scene.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0x2c3a42, transparent: true, opacity: 0.9 })));
  const f = [];
  X.fires.forEach(([kind, h]) => { const a = h / 24 * Math.PI * 2, r0 = 4.07, r1 = 4.2; f.push(r0 * Math.sin(a), HGT(4.25), -r0 * Math.cos(a), r1 * Math.sin(a), HGT(4.25), -r1 * Math.cos(a)); });
  const fg = new THREE.BufferGeometry(); fg.setAttribute("position", new THREE.Float32BufferAttribute(f, 3));
  scene.add(new THREE.LineSegments(fg, new THREE.LineBasicMaterial({ color: 0x7d97a6 })));
  const s = [];
  for (let i = 0; i < 80; i++) { const h0 = 9.5 + i / 80 * 6.5, h1 = 9.5 + (i + 1) / 80 * 6.5, R = 4.62; const a0 = h0 / 24 * Math.PI * 2, a1 = h1 / 24 * Math.PI * 2; s.push(R * Math.sin(a0), HGT(4.25), -R * Math.cos(a0), R * Math.sin(a1), HGT(4.25), -R * Math.cos(a1)); }
  const sg = new THREE.BufferGeometry(); sg.setAttribute("position", new THREE.Float32BufferAttribute(s, 3));
  scene.add(new THREE.LineSegments(sg, new THREE.LineBasicMaterial({ color: 0xffb547, transparent: true, opacity: 0.45 })));
}
// the hand: the time of this snapshot
const NOW_H = 23.25;
{
  const a = NOW_H / 24 * Math.PI * 2, g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, HGT(4.25), 0), new THREE.Vector3(4.75 * Math.sin(a), HGT(4.25), -4.75 * Math.cos(a))]);
  scene.add(new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 })));
}
const replayHand = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]), new THREE.LineBasicMaterial({ color: 0xffffff }));
replayHand.visible = false; scene.add(replayHand);

// ------------------------------------------------------------------ nodes
const SIZE = { series: 2.4, job: 6, product: 9, result: 5.5, strategy: 5.5, feed: 11, limit: 5.5, book: 18, kill: 8 };
function baseColor(n) {
  const c = new THREE.Color();
  const v = n.m.verdict || "";
  if (n.k === "series") return c.setRGB(...({ daily: [0.55, 0.67, 0.74], filings: [0.36, 0.44, 0.49], minute: [0.5, 0.64, 0.72], options: [0.62, 0.68, 0.74], macro: [0.6, 0.62, 0.78], factors: [0.6, 0.62, 0.78], "13f": [0.6, 0.62, 0.78] }[n.m.track]));
  if (n.k === "product" || n.k === "result") {
    if (n.m.status === "skipped") return c.setRGB(0.35, 0.37, 0.4);
    if (/FAIL/.test(v)) return c.set("#ff4f9a");
    if (/PASS/.test(v)) return c.set("#c8f5d6");
    return c.setRGB(0.78, 0.87, 0.93);
  }
  if (n.k === "strategy") return c.setRGB(0.93, 0.88, 0.78);
  if (n.k === "limit") return c.setRGB(0.68, 0.74, 0.79);
  return c.setRGB(0.93, 0.96, 1.0);
}
const nPos = new Float32Array(N.length * 3), nCol = new Float32Array(N.length * 3), nSize = new Float32Array(N.length), nGlow = new Float32Array(N.length);
N.forEach((n, i) => {
  P[i].toArray(nPos, i * 3); baseColor(n).toArray(nCol, i * 3);
  nSize[i] = isTrack(n) ? 1.8 : SIZE[n.k] || 3; nGlow[i] = 0.75;

const nGeo = new THREE.BufferGeometry();
nGeo.setAttribute("position", new THREE.BufferAttribute(nPos, 3));
nGeo.setAttribute("color", new THREE.BufferAttribute(nCol, 3));
nGeo.setAttribute("aSize", new THREE.BufferAttribute(nSize, 1));

  uniforms: { uPR: { value: PR } },
  vertexShader: `
    uniform float uPR; attribute vec3 color; attribute float aSize, aGlow; varying vec3 vC; varying float vG;
    void main() {

      gl_PointSize = aSize * uPR * clamp(24.0 / -mv.z, 0.55, 2.4) * (0.8 + 0.35 * clamp(aGlow, 0.0, 1.5));
      vC = color; vG = aGlow;

  fragmentShader: `
    varying vec3 vC; varying float vG;
    void main() {

      float b = vG < 0.05 ? 0.13 : mix(0.13, 1.0, clamp(vG, 0.0, 1.0)) * (1.0 + 0.5 * max(vG - 1.0, 0.0));

const nodesObj = new THREE.Points(nGeo, nMat); nodesObj.frustumCulled = false; scene.add(nodesObj);

// ------------------------------------------------------------------ edges: every real dependency, drawn as a fibre that arches toward its target
const SEG = 16;
const ePos = new Float32Array(E.length * SEG * 2 * 3), eT = new Float32Array(E.length * SEG * 2), eHi = new Float32Array(E.length * SEG * 2), eW = new Float32Array(E.length * SEG * 2), eSeed = new Float32Array(E.length * SEG * 2);
{
  const A = new THREE.Vector3(), B = new THREE.Vector3(), Cc = new THREE.Vector3(), q = new THREE.Vector3(), p0 = new THREE.Vector3();

    const na = N[a], nb = N[b]; A.copy(P[a]); B.copy(P[b]);

      const t0 = s / SEG, t1 = (s + 1) / SEG, k = (ei * SEG + s) * 2;

      "vol.forecast_league": () => `<p>Every weeknight four volatility models forecast the next day for <b>421</b> names, scored out of sample on the last 250 sessions. GARCH stays in the statistical best set for <b>96%</b> of names; EWMA, the simplest, for <b>90%</b>.</p><p>It matters downstream: the ${T("j:signals.overlay", "exposure overlay")} takes each name's best model to size the desk.</p>`,
      "cov.league": () => `<p>Seven ways to estimate the covariance matrix compete each weekend: the league builds a minimum-variance book with each and measures what it actually did. On the Nasdaq-100, Ledoit–Wolf shrinkage to the identity wins (<b>14.8%</b> realized vol against <b>16.0%</b> for the raw sample matrix); on the sectors, OAS.</p><p>The ${T("j:signals.overlay", "exposure overlay")} uses the winner.</p>`,
      "risk.mc_atlas": () => { const a = N[byId.get("am:fhs:10")].m; return `<p>For a $1M multi-asset book the atlas simulates <b>1,000,000</b> ten-day paths by filtered historical simulation, and again with a t-copula, in Rust. The ten-day 99% VaR is <b>${pct(-a.var, 2)}</b> (about $${num(a.var_usd)}) and the ES <b>${pct(-a.es, 2)}</b>.</p><p>It reads all <b>563</b> tickers because it also measures each name on its own.</p>`; },
      "models.xs_lgbm": () => `<p>A gradient-boosted model ranks 34 ETFs every month. If its scores meant anything, next month's returns would climb decile by decile; they don't (the top tenth earned <b>0.89%</b>, the fourth <b>1.19%</b>). It fails its gates, so nothing downstream uses it.</p>`,
      "regime.hmm": () => `<p>A four-state hidden Markov model reads SPY's weekly returns and the VIX since 1996. Its high-volatility state lit up in 2008, 2011, 2020, 2022 and April 2025; right now its probability is <b>${X.regime.p_high.toFixed(2)}</b>.</p><p>It adds nothing over a simple moving average of volatility, so it stays descriptive.</p>`,
      "vol.surface_history": () => `<p>From Cboe's delayed quotes the server fits a volatility smile per expiry for <b>30</b> underlyings and keeps the history. SPY's 30-day at-the-money vol is <b>${(X.surface.atm30 * 100).toFixed(1)}%</b> from ${num(X.surface.contracts)} contracts.</p>`,
      "kronos.shadow": () => `<p>Kronos, a foundation model for price series, failed its pre-registered test (EXP-K01). It still runs every night in the shadow, scored against the incumbents on days it has never seen, so the verdict can be revisited on evidence rather than hope.</p>`,
      "ops.data_integrity": () => `<p>Every weeknight it checks all daily series for unadjusted splits, bad prints and stale data. It detects and never repairs: a repair to a published input is the owner's call.</p>`,
      "signals.daily": () => { const n0 = (m.notes || [])[0] || "", g = k => (n0.match(new RegExp("(\\d+) " + k)) || [])[1];
        return `<p>This is where research becomes orders. For each farm cell on the roster it takes the month's frozen parameters, runs the strategy's own backtest function, and turns its last row into a signed document for the desk to judge.</p>
        <p>Last night: <b>${g("written") ?? "—"}</b> new documents, <b>${(n0.match(/(\d+) written again/) || [])[1] ?? "—"}</b> written again because the desk hadn't sized the last one, <b>${g("held") ?? "—"}</b> held (not a decision day for that strategy) and <b>${g("refused") ?? "—"}</b> refused.</p>
        <p>Two caveats it states about itself: a farm verdict was earned at the strategy's default leverage (<b>2–3×</b> for some), while the desk trades de-levered <b>1×</b> targets; and backtests fill at the next close while the desk fills at the next open. So a cell's verdict isn't evidence at the leverage and price the desk actually trades.</p>`; },
      "signals.overlay": () => { const all = (m.notes || []).join(" "), s = all.match(/exposure_scale ([\d.]+) = min\(1, ([\d.]+) \/ ([\d.]+)\)/), fb = /no rank-1 row for site_etfs: (\w+)/.exec(all);
        return `<p>One number for the whole desk: an exposure scale toward a volatility target. It combines the roster's targets with a covariance matrix from the ${T("p:cov.league", "covariance league")} and each name's best volatility model from the ${T("p:vol.forecast_league", "vol league")}.</p>
        ${s ? `<p>Tonight the combined book forecasts <b>${(s[3] * 100).toFixed(1)}%</b> volatility against a <b>${(s[2] * 100).toFixed(0)}%</b> target, so the scale is <b>${(+s[1]).toFixed(2)}</b>: the desk is nowhere near its risk budget.${fb ? ` The league had no winner for the desk's ETF universe, so it fell back to <span class="tok">${fb[1].replace(/_/g, " ")}</span>.` : ""} The regime model and the risk atlas are reported alongside, and deliberately never used.</p>` : ""}
        <p>If a forecast isn't finite the job fails loudly, and the desk holds its last scale until that goes stale.</p>`; },
    };
    return lead + v + (S[m.kind] ? S[m.kind]() : `<p>${esc(n.n)} is published by ${T("j:" + m.kind)}.</p>`);
  }
  if (n.k === "result" && n.id.startsWith("c:")) {
    const s = N.find(x => x.k === "strategy" && x.m.strategy === m.strategy && x.m.universe === n.l.split("@")[1]);
    return `<h2>${esc(n.n)}</h2>${m.status !== "ok" ? `<p>Skipped tonight: ${esc(m.reason || "")}.</p>` : `<p><b>${num(m.combos)}</b> parameter variants. The chosen one scored an out-of-sample Sharpe of <b>${num(m.oos_sharpe_ann, 2)}</b>; deflated for the farm's ${num(X.farm.trials)} trials that is a DSR of <b>${num(m.dsr_farm, 2)}</b>. Verdict <b class="fail-t">${esc((m.verdict || "").toLowerCase())}</b>.</p>`}${s ? `<p>On the desk it trades as ${T(s.id)} at 2.5% of capital.</p>` : ""}`;
  }
  if (n.k === "result") return `<h2>${esc(n.n)}</h2><p>A result inside ${[...web.up.keys()].filter(k => N[k].k === "product").map(k => T(N[k].id)).join(", ")}.</p>`;
  if (n.k === "strategy") return `<h2>${esc(n.n)}</h2><p>One of the desk's 23 strategies, with <b>${(m.capital * 100).toFixed(1)}%</b> of capital. ${m.producer === "signals.daily" ? `Its signals come from ${T("p:signals.daily", "daily signals")}, using the farm cell ${T(`c:${m.strategy}@${m.universe}`)}.` : "Its signals come from the research service (EXP-A01)."}</p>`;
  if (n.k === "book") return `<h2>The book</h2><p>Everything outside it exists to feed this: a paper account at Alpaca run by OhCamel's OCaml engine. <b>23</b> strategies send it signals, 21 from the farm and 2 from the research service, each at <b>2.5%</b> of capital under a <b>60%</b> incubation cap. The ${T("p:signals.overlay", "overlay")} scales total exposure toward a volatility target.</p><p>Seven limits bound it, and three of them (book size, VaR and drawdown) trip the ${T("kill", "kill switch")}, which is armed. On 28 October it held <b>5</b> positions.</p>`;
  if (n.k === "limit") return `<h2>${esc(n.l)}</h2><p>${esc(m.scope)}: ${esc(m.what)}.${m.trips ? " Breaking it trips the kill switch, which halts every new order." : " Breaking it raises an alert."}</p><p class="dim">Thresholds here are the public example book's; the live book's values are private.</p>`;
  if (n.k === "kill") return `<h2>The kill switch</h2><p>Armed. If ${T("lim:book-cap")}, ${T("lim:var-cap")} or ${T("lim:dd-cap")} breaks, it halts the desk: every new order is refused until the owner clears it.</p>`;
  return `<h2>${esc(n.n)}</h2>`;
}

// ------------------------------------------------------------------ selection

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { setTab(b.dataset.t); if (b.dataset.t === "tour") goStep(step); if (b.dataset.t === "day") renderDay(); });
document.addEventListener("click", e => {

document.querySelectorAll("#webmode button").forEach(b => b.onclick = () => {

// ------------------------------------------------------------------ camera
const goal = { active: false, t0: 0, dur: 1.5, fromT: new THREE.Vector3(), toT: new THREE.Vector3(), fromS: new THREE.Spherical(), toS: new THREE.Spherical() };
function sph(d, pol, az) { return new THREE.Spherical(d, pol, az); }
function flyTo(target, s, dur = 1.5) {
  goal.fromT.copy(controls.target); goal.toT.copy(target);
  goal.fromS.setFromVector3(camera.position.clone().sub(controls.target)); goal.toS.copy(s);
  let d = goal.toS.theta - goal.fromS.theta; goal.toS.theta = goal.fromS.theta + Math.atan2(Math.sin(d), Math.cos(d));
  goal.t0 = performance.now() / 1000; goal.dur = reduced ? 0.01 : dur; goal.active = true;
}
const azFor = a => Math.PI - a;  // puts a ring angle on the near side
function frameNode(i) {
  const n = N[i], p = P[i];
  if (n.k === "book" || n.k === "limit" || n.k === "kill" || n.k === "strategy") return flyTo(new THREE.Vector3(0, 0.3, 0), sph(9.5, 0.95, azFor(n.k === "book" ? 0.25 : n.a)));
  const big = web.up.size + web.down.size > 60;
  const t = p.clone().multiplyScalar(big ? 0.3 : 0.55); t.y = big ? 1.2 : HGT(n.r) * 0.6 + 0.4;
  flyTo(t, sph(big ? 19.5 : n.r > 6 ? 15 : 12.5, big ? 0.82 : 0.98, azFor(n.a)));
}

// ------------------------------------------------------------------ the tour: scroll walks inward from the world to the book
const STEPS = [
  { sel: null, cam: () => [new THREE.Vector3(0, 1.4, 0), sph(27, 0.92, 0.35)], title: "The machine, at 11:15 PM on a Wednesday",
    body: () => `<p>This is OhCamel drawn as what it is: rings that narrow to one book. The outer ring is the world's data. The clock is the machine's day, with every scheduled job at its time. Inside are what the jobs publish, the desk's 23 strategies, and at the centre a paper account that trades.</p><p>Every line is a real dependency, read from the system's own schedules and provenance. Scroll to walk inward. Click anything to take over.</p>` },
  { sel: "feed:prices", title: "Outside: six feeds",
    body: () => `<p>Every weekday at 6:30 PM the server pulls closing prices for <b>563</b> tickers. Around them: one-minute bars for 50 names, option chains for 30, 35 FRED series, Ken French's factors, and SEC filings for 518 companies. The tracks of the outer ring are those datasets, <b>1,204</b> series in all.</p>` },
  { sel: "d:NVDA", title: "One stock, followed inward",
    body: () => `<p>${T("d:NVDA", "NVDA")} sits on all four tracks: daily bars, minute bars, an option chain and SEC filings. Its daily bars are read by <b>four jobs</b> tonight and watched by a position limit; its minute bars feed the ${T("j:vol.forecast_league", "vol league")} and its option chain the ${T("j:vol.surface_history", "surface")} job.</p><p>The cyan lines are where its influence goes. ${(() => { const st = [...web.down.keys()].filter(k => N[k].k === "strategy").length; return st ? `It reaches <b>${st}</b> strategies and the book.` : `None of the desk's strategies trade it, yet it still reaches the book: through the ${T("p:signals.overlay", "exposure overlay")}, which sizes everything, and through its own position limit.`; })()} Click any ticker on the outer ring to see its own web.</p>` },
  { sel: "j:vol.forecast_league", title: "The clock",
    body: () => `<p>The middle ring is a 24-hour dial. Each tick is a scheduled run; the amber arc is the market session, when nothing heavy is allowed to start. The heaviest job last night was the ${T("j:vol.forecast_league", "vol forecast league")}: it read <b>421</b> names for <b>64</b> minutes and <b>3,846</b> CPU-seconds.</p><p>Open <b>The day</b> tab to replay the last 24 hours.</p>` },
  { sel: "p:farm.sweep", title: "The farm, and an honest failure",
    body: () => `<p>At 11 PM the ${T("p:farm.sweep", "strategy farm")} re-tests the desk's strategies: 21 cells, <b>${num(X.farm.trials)}</b> parameter variants. The best scored a Sharpe of 2.39, but after deflating for every trial, <b>no cell passes</b>. The pink is shown, not hidden.</p>` },
  { sel: "p:signals.overlay", title: "Where research becomes orders",
    body: () => `<p>Two jobs connect the research to the desk. ${T("j:signals.daily", "Daily signals")} turns each farm cell's backtest into a signed document. The ${T("p:signals.overlay", "exposure overlay")} sizes the whole desk toward a 10% volatility target from the covariance and vol leagues. Tonight the book forecast 3.4%, so it runs at full scale.</p><p>Open <b>Reading</b> for the caveats these jobs record about themselves.</p>` },
  { sel: "book", title: "The book",
    body: () => `<p>Everything ends here. <b>23</b> strategies at <b>2.5%</b> of capital each, under a 60% incubation cap; seven limits; and a kill switch, armed, that halts every new order if the book size, VaR or drawdown limit breaks.</p>` },
  { sel: null, cam: () => [new THREE.Vector3(0, 1.2, 0), sph(23, 0.62, -0.5)], title: "Now it's yours",
    body: () => `<p>Drag to turn the machine, click anything to read it, or search above. Some places to start:</p><p>${["d:SPY", "p:risk.mc_atlas", "p:kronos.shadow", "kill", "f:VIXCLS", "c:xsmom@sectors", "feed:sec"].map(id => T(id)).join(" ")}</p><p>Each ring also has a page where you work with it directly: Markets, Risk, Portfolios, Research, Volatility, Rates and Companies, along the top.</p>` },
];
let step = 0;
function goStep(k) {
  step = clamp(k, 0, STEPS.length - 1);
  const S = STEPS[step];
  const i = S.sel ? byId.get(S.sel) : -1;
  sel = i; applyWeb(i); focus(i);
  if (i >= 0) $("#p-read").innerHTML = reading(i);
  if (S.cam) { const [t, s] = S.cam(); flyTo(t, s, 1.8); } else if (i >= 0) frameNode(i);
  $("#p-tour").innerHTML = `
    <div class="tstep"><span>${step + 1} / ${STEPS.length}</span><span class="dots">${STEPS.map((_, k) => `<button class="${k === step ? "on" : ""}" data-step="${k}" aria-label="step ${k + 1}"></button>`).join("")}</span></div>
    <h2>${S.title}</h2>${S.body()}
    <div class="tnav"><button data-prev ${step === 0 ? "disabled" : ""}>↑ back</button><span>scroll or use the arrow keys</span><button data-next ${step === STEPS.length - 1 ? "disabled" : ""}>next ↓</button></div>`;
}
$("#p-tour").addEventListener("click", e => {
  if (e.target.closest("[data-next]")) goStep(step + 1);
  else if (e.target.closest("[data-prev]")) goStep(step - 1);
  else if (e.target.closest("[data-step]")) goStep(+e.target.closest("[data-step]").dataset.step);
});
let wheelAcc = 0, wheelLock = 0;
addEventListener("wheel", e => {
  if (tab !== "tour" || e.target.closest(".panel")) return;
  const now = performance.now(); wheelAcc += e.deltaY;
  if (now < wheelLock) return;
  if (Math.abs(wheelAcc) > 60) { goStep(step + Math.sign(wheelAcc)); wheelAcc = 0; wheelLock = now + 900; }
}, { passive: true });
addEventListener("keydown", e => {
  if (e.target.closest("input")) return;
  if (tab === "tour" && (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ")) { e.preventDefault(); goStep(step + 1); }
  if (tab === "tour" && (e.key === "ArrowUp" || e.key === "PageUp")) { e.preventDefault(); goStep(step - 1); }
  if (e.key === "Escape") { select(-1); }
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); }
});

// ------------------------------------------------------------------ the day: replay the last 24 hours on the clock
const runs = G.runs.map(r => ({ ...r, t0: Date.parse(r.start), t1: Date.parse(r.end) }));
const R0 = Math.min(...runs.map(r => r.t0)), R1 = Math.max(...runs.map(r => r.t1));
let replay = null;
function renderDay() {
  const cpu = runs.reduce((a, r) => a + r.cpu, 0);
  $("#p-day").innerHTML = `
    <div class="play"><button id="playbtn">${replay ? "■ stop" : "▶ replay the day"}</button><span class="t" id="playt">${runs.length} runs · ${num(cpu, 0)} cpu-s on 2 cores</span></div>
    <div class="runs">${runs.map((r, k) => `<div class="r" data-run="${k}" data-sel="${byId.get("j:" + r.kind) ?? ""}"><span>${tET(r.start)}</span><span>${esc(N[byId.get("j:" + r.kind)]?.l || r.kind)}</span><span>${num(r.cpu, 0)} s</span></div>`).join("")}</div>`;
  $("#playbtn").onclick = () => { replay ? stopReplay() : startReplay(); };
}
function startReplay() { replay = { t0: performance.now() / 1000, dur: 26, last: -1 }; select(-1, { frame: false }); flyTo(new THREE.Vector3(0, 1.2, 0), sph(19, 0.5, 0.2)); replayHand.visible = true; renderDay(); }
function stopReplay() { replay = null; replayHand.visible = false; applyWeb(sel); renderDay(); }
function tickReplay(now) {
  if (!replay) return;
  const f = (now - replay.t0) / replay.dur;
  if (f >= 1) { stopReplay(); return; }
  const t = R0 + f * (R1 - R0), d = new Date(t);
  const h = +d.toLocaleString("en-US", { hour: "numeric", hour12: false, timeZone: "America/New_York" }) % 24 + d.getMinutes() / 60;
  const a = h / 24 * Math.PI * 2;
  replayHand.geometry.setFromPoints([new THREE.Vector3(0, HGT(4.25), 0), new THREE.Vector3(4.8 * Math.sin(a), HGT(4.25), -4.8 * Math.cos(a))]);
  const k = runs.findLastIndex(r => r.t0 <= t);
  if (k !== replay.last && k >= 0) {
    replay.last = k; const ji = byId.get("j:" + runs[k].kind);
    if (ji !== undefined) { applyWeb(ji, true); nGlow[ji] = 2.2; nGeo.attributes.aGlow.needsUpdate = true; }
    document.querySelectorAll(".runs .r").forEach(r => r.classList.toggle("on", +r.dataset.run === k));
    document.querySelector(`.runs .r[data-run="${k}"]`)?.scrollIntoView({ block: "nearest" });
  }
  const el = $("#playt"); if (el) el.textContent = d.toLocaleString("en-US", { weekday: "short", hour: "numeric", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
}

// ------------------------------------------------------------------ search
const q = $("#q"), res = $("#results");
const searchIndex = N.map((n, i) => ({ i, s: `${n.l} ${n.n} ${n.id} ${n.m.full || ""} ${n.m.kind || ""}`.toLowerCase() }));
let hits = [], hiIdx = 0;
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase(); if (!s) { res.style.display = "none"; return; }
  const pri = n => ({ book: 0, product: 1, feed: 1, job: 2, strategy: 2, result: 3, limit: 3, kill: 3, series: n.m.track === "daily" ? 4 : 6 }[n.k]);
  hits = searchIndex.filter(x => x.s.includes(s)).map(x => x.i).sort((a, b) => (N[a].l.toLowerCase() === s ? -10 : 0) - (N[b].l.toLowerCase() === s ? -10 : 0) || pri(N[a]) - pri(N[b])).slice(0, 12);
  hiIdx = 0;
  res.innerHTML = hits.map((i, k) => `<button class="${k === 0 ? "hi" : ""}" data-pick="${i}">${esc(N[i].k === "series" ? N[i].l + " · " + (N[i].m.full || N[i].n) : N[i].n)}<span>${N[i].k}${N[i].m.track && N[i].m.track !== "daily" ? " · " + N[i].m.track : ""}</span></button>`).join("") || `<button disabled>no match</button>`;
  res.style.display = "block";
});
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && hits.length) { select(hits[hiIdx]); res.style.display = "none"; q.blur(); }
  if (e.key === "Escape") { res.style.display = "none"; q.blur(); }
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); hiIdx = clamp(hiIdx + (e.key === "ArrowDown" ? 1 : -1), 0, hits.length - 1); [...res.children].forEach((b, k) => b.classList.toggle("hi", k === hiIdx)); }
});
res.addEventListener("mousedown", e => { const b = e.target.closest("[data-pick]"); if (b) { select(+b.dataset.pick); res.style.display = "none"; q.value = ""; } });
q.addEventListener("blur", () => setTimeout(() => res.style.display = "none", 150));

// ------------------------------------------------------------------ hover and click on the machine
const tip = $("#tip"), scr = new Float32Array(N.length * 2), tmp = new THREE.Vector3();
let mouse = null, hover = -1, down = null;
canvas.addEventListener("pointermove", e => { mouse = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener("pointerleave", () => { mouse = null; });
canvas.addEventListener("pointerdown", e => { down = { x: e.clientX, y: e.clientY }; canvas.classList.add("drag"); });
addEventListener("pointerup", e => {
  canvas.classList.remove("drag");
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved > 5 || e.target !== canvas) return;
  if (hover >= 0) select(hover); else if (sel >= 0) { select(-1); }
});
function pick() {
  if (!mouse) { hover = -1; tip.style.opacity = 0; canvas.classList.remove("point"); return; }
  let best = -1, bd = 1e9;
  for (let i = 0; i < N.length; i++) {
    tmp.copy(P[i]).project(camera); if (tmp.z > 1) continue;
    const x = (tmp.x * 0.5 + 0.5) * innerWidth, y = (-tmp.y * 0.5 + 0.5) * innerHeight;
    const r = N[i].k === "series" ? 6 : 12, d = Math.hypot(x - mouse.x, y - mouse.y);
    const score = d - (N[i].k === "series" ? 0 : 4);
    if (d < r && score < bd) { bd = score; best = i; }
  }
  hover = best; canvas.classList.toggle("point", best >= 0);
  if (best < 0) { tip.style.opacity = 0; return; }
  const n = N[best];
  tip.innerHTML = `<b>${esc(n.k === "series" ? n.l : n.n)}</b>${n.k === "series" ? `<br>${esc(n.m.full || n.n)}` : ""}${n.m.verdict ? `<br><span style="color:${/FAIL/.test(n.m.verdict) ? "var(--fail)" : "#9fb3bf"}">${esc(n.m.verdict)}</span>` : ""}<br><span class="dim">${n.k}${n.m.track ? " · " + n.m.track : ""} · click to select</span>`;
  tip.style.opacity = 1;
  tip.style.transform = `translate(${Math.min(mouse.x + 14, innerWidth - 330)}px, ${mouse.y + 14}px)`;
}

// ------------------------------------------------------------------ frame loop
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
camera.position.set(0, 14, 24); controls.target.set(0, 1.4, 0); controls.update();
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
let frameNo = 0; const viewOff = { x: 212, y: 0 };
function frame() {
  const now = performance.now() / 1000;
  if (goal.active) {
    const f = clamp((now - goal.t0) / goal.dur), e = ease(f);
    controls.target.lerpVectors(goal.fromT, goal.toT, e);
    const s = new THREE.Spherical(lerp(goal.fromS.radius, goal.toS.radius, e), lerp(goal.fromS.phi, goal.toS.phi, e), lerp(goal.fromS.theta, goal.toS.theta, e));
    camera.position.copy(controls.target).add(new THREE.Vector3().setFromSpherical(s));
    if (f >= 1) goal.active = false;
  }
  controls.update();
  const narrowNow = innerWidth < 860, focusOn = $("#focus").classList.contains("on");
  const wantX = narrowNow ? 0 : ((424) - (focusOn ? 394 : 0)) / 2, wantY = narrowNow ? innerHeight * 0.2 : 0;
  viewOff.x += (wantX - viewOff.x) * 0.08; viewOff.y += (wantY - viewOff.y) * 0.08;
  camera.setViewOffset(innerWidth, innerHeight, viewOff.x, viewOff.y, innerWidth, innerHeight);
  eMat.uniforms.uTime.value = reduced ? 0 : now;
  tickReplay(now);
  if (frameNo++ % 2 === 0) pick();
  const placed = [], cand = [];
  for (const L of labels) {
    let vis = 1;
    if (L.node !== null) {
      const g = nGlow[L.node];
      vis = L.show === "web" ? (sel >= 0 && g > 0.5 && (N[L.node].k !== "series" || web.up.size + web.down.size < 140 || L.node === sel) ? 1 : 0)
        : L.show === "near" ? (sel < 0 ? 0.55 : g > 0.5 ? 1 : 0.12) : (sel < 0 ? 0.9 : g > 0.5 ? 1 : 0.25);
      L.el.classList.toggle("sel", L.node === sel);
      L.el.classList.toggle("up", sel >= 0 && L.node !== sel && web.up.has(L.node) && !/FAIL/.test(N[L.node].m.verdict || ""));
      L.el.classList.toggle("down", sel >= 0 && L.node !== sel && web.down.has(L.node) && !/FAIL/.test(N[L.node].m.verdict || ""));
    } else vis = sel >= 0 ? 0.45 : 0.9;
    if (vis < 0.02) { if (L.shown !== 0) { L.el.style.opacity = 0; L.shown = 0; } continue; }
    tmp.copy(L.v).project(camera);
    if (tmp.z > 1) { if (L.shown !== 0) { L.el.style.opacity = 0; L.shown = 0; } continue; }
    const x = (tmp.x * 0.5 + 0.5) * innerWidth, y = (-tmp.y * 0.5 + 0.5) * innerHeight;
    const pri = L.pri + (L.node === sel ? 20 : L.node !== null && nGlow[L.node] > 0.5 && sel >= 0 ? 4 : 0);
    cand.push({ L, x, y, vis, pri });
  }
  cand.sort((a, b) => b.pri - a.pri);
  for (const c of cand) {
    const L = c.L; if (!L.w) L.w = L.el.offsetWidth || 60;
    const r = [c.x - L.w / 2 - 3, c.y - 15, c.x + L.w / 2 + 3, c.y];
    if (placed.some(q => r[0] < q[2] && r[2] > q[0] && r[1] < q[3] && r[3] > q[1])) { if (L.shown !== 0) { L.el.style.opacity = 0; L.shown = 0; } continue; }
    placed.push(r);
    L.el.style.opacity = c.vis; L.shown = 1;
    L.el.style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px) translate(-50%, -100%)`;
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
function lerp(a, b, t) { return a + (b - a) * t; }
goStep(0);
requestAnimationFrame(frame);
</script>
