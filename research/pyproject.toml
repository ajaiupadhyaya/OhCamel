[project]
name = "ohcamel-research"
version = "0.1.0"
description = "OhCamel research layer: replay feed, signal emission, strategies through fdq's validation battery"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ajai Upadhyaya" }]

dependencies = [
    # Five Dollar Quant: the data layer (real bars with provenance) and the
    # validation battery. Pinned to the commit that carries the walk-forward,
    # DSR/PSR/PBO and power-analysis code plus the wheel-build fix this layer
    # needed, on a feature branch ahead of main; see the design spec's "Risks,
    # stated".
    "fdq @ git+https://github.com/ajaiupadhyaya/capitallimits.git@652474c02b4919ed9842ec2d9510c6327b92f874",
    "click>=8.1",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3", "mypy>=1.9", "pandas-stubs", "types-jsonschema", "types-PyYAML"]

[project.scripts]
ohcamel-research = "ohcamel_research.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# fdq is a git dependency; hatchling refuses direct references unless told.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/ohcamel_research"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
