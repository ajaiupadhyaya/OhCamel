# The one cost file (completion spec, "Costs."): read by the backtest engine
# (quant backtest/costs.py -> backtest/engine.py), the public Strategy Lab
# (api/routers/backtest.py: a run that sets no cost, borrow or financing pays
# this file's; a number the visitor types replaces it for that run), the
# strategy farm (products/farm.py, models/farm.py), the desk's daily signals
# (signals/daily.py) and the research battery's capacity figure
# (research battery/gates.py).
#
# Cost numbers that deliberately remain elsewhere, and why:
#   * research/experiments/EXP-Q01/config.yaml (cost_bps_base: 5, its own
#     accounting in models/xsec.py) and research/config/friction_v1.yaml
#     (EXP-A01's spreads and fees):
#     pre-registered experiments, frozen before their results and hashed
#     into their manifests; moving them would change a registered test.
#   * quant portfolio/walkforward.py (the optimiser's 10 bp form default):
#     a portfolio optimiser's turnover cost, not a backtest of a strategy.
#   * book.example.sexp (spread_bps) and bin/main.ml (half_spread_bps 5.0):
#     the desk's own paper fill model, OCaml, read by the engine, not by
#     Python; aligning it with this file is the desk's change to make.
#
# Every fill pays the half-spread of its ticker's tier on the traded notional
# (one way: a round trip pays it twice). A ticker with no row here has no
# cost, and the engine refuses to run it rather than guess one.
#
# Shorts pay `borrow_bps` a year on short notional. A book whose gross
# exposure exceeds 1 pays `financing_spread_bps` a year on the excess, on top
# of the risk-free rate the engine already charges on borrowed cash (the
# engine's cash term: cash = 1 - sum(w) earns, or pays, the risk-free series
# the caller passes -- the T-bill rate in the farm and the desk's signals).
#
# The sweep multiplies every half-spread by each of `sweep` and re-prices the
# walk-forward OUT-OF-SAMPLE series the gates judge. Capacity is the capital
# at which the largest rebalance trade is `participation` of the name's
# `adv_window`-session median dollar volume.
version: "1.0.0"

tiers_bps:      # half-spread, one way, on traded notional
  1: 1.0
  2: 3.0
  3: 8.0

borrow_bps: 50.0             # a year, on short notional
financing_spread_bps: 50.0   # a year, on gross exposure above 1, over the risk-free rate
sweep: [0, 1, 3, 6]          # multiples of the half-spread
capacity:
  participation: 0.01        # the largest rebalance trade at 1% of ...
  adv_window: 20             # ... the 20-session median dollar volume

# HOW A TIER IS MEASURED (tools/measure_spreads.py): for each name, the median
# IEX quoted half-spread, (ask - bid) / 2 / mid in bp, over quotes sampled in
# the sessions the warehouse's bars_minute stores, rounded UP to the first tier
# whose half-spread covers it (<= 1 bp: tier 1, <= 3: tier 2, <= 8: tier 3;
# above 8 bp the script refuses to assign a tier). A measured row says
# `source: measured` with the script's output file beside this one.
#
# PROVISIONAL (2026-11-23): no IEX quote data was available where this file
# was written (the warehouse lives on the droplet; bars_minute stores trades'
# OHLCV, not quotes), so every row below is assigned by this stated rule,
# conservative by construction -- a name goes UP a tier whenever there is doubt:
#   tier 1: SPY, QQQ, IWM only -- the three US equity ETFs with the deepest
#           books, each trading tens of billions of dollars a day.
#   tier 2: broad US equity (DIA, MDY); the nine original Select Sector SPDRs;
#           US Treasury ETFs (BIL, SHY, IEI, IEF, TLT, TIP); US corporate
#           credit (LQD, HYG); broad international (EFA, EEM); gold (GLD).
#   tier 3: everything else -- the two newest sectors (XLRE, XLC), the style
#           factors, EM debt (EMB), single regions and countries (VGK, EWJ,
#           FXI, INDA), silver and the commodity futures funds.
# MEASURED (2026-11-26): the script ran on the droplet over the 20 sessions
# 2026-10-29 .. 2026-11-25 (costs_measured.csv and its .meta.json beside this
# file, code b006624) and 41 of the 42 rows below are its tiers. IEX's own
# quotes, not the consolidated NBBO, so a measured tier is if anything wide.
# USO measured 151.4 bp, above the widest tier, so the script assigns it none;
# its row keeps the provisional tier 3 until the owner decides (a fourth tier,
# a consolidated-quote measurement, or leaving it). The engine does not
# distinguish the two sources; a page that shows a cost says which it is.
tickers:
  # us_equity_indices
  SPY:  {tier: 1, source: measured}
  QQQ:  {tier: 1, source: measured}
  IWM:  {tier: 1, source: measured}
  DIA:  {tier: 1, source: measured}
  MDY:  {tier: 3, source: measured}
  # sectors
  XLK:  {tier: 1, source: measured}
  XLF:  {tier: 1, source: measured}
  XLE:  {tier: 1, source: measured}
  XLV:  {tier: 1, source: measured}
  XLI:  {tier: 1, source: measured}
  XLY:  {tier: 1, source: measured}
  XLP:  {tier: 1, source: measured}
  XLU:  {tier: 2, source: measured}
  XLB:  {tier: 1, source: measured}
  XLRE: {tier: 2, source: measured}
  XLC:  {tier: 1, source: measured}
