# The one regime table (completion task 2.5, owner ruling R3; spec, "Gates (R3)":
# "Regimes: one table, in one file, read by both batteries").
#
# Read by the quant battery (quant models/regimes.py -> models/verdict.py:
# the strategy farm and EXP-Q01's holdout) and by the research battery
# (research battery/regimes.py -> battery/gates.py's regime_gate: EXP-A01 and
# every experiment the runner judges). Neither package holds a second copy;
# tests in both packages read this file through the other package's loader
# and require the same tuple. The research manifests hash this file
# (manifest.REGIMES_REL), so editing it stales their evidence.
#
# The list is the union of the two lists the batteries held before (quant:
# 2008, 2015-16, 2020, 2022, 2024; research: 2018 Q4, 2020, 2022, 2023, 2024)
# plus 2011, without 2023 (the ruling's list). Each window is written once,
# here, by one rule: a regime named by a year is that calendar year; 2015-16
# is the two calendar years; 2018Q4 is that quarter. The name is the window.
#
# The gate (docs/CHARTER.md, "The gates"): a strategy's out-of-sample record
# is positive -- compounded return strictly above zero -- in at least 3 of
# these regimes. A regime "has out-of-sample data" when the record holds at
# least one return inside its window; a regime without data counts as not
# positive. Fewer than 3 regimes with data is INSUFFICIENT DATA, not FAIL.
version: "1.0.0"
regimes:
  - {name: "2008", start: "2008-01-01", end: "2008-12-31"}     # the financial crisis
  - {name: "2011", start: "2011-01-01", end: "2011-12-31"}     # the US downgrade and the euro debt crisis
  - {name: "2015-16", start: "2015-01-01", end: "2016-12-31"}  # the yuan devaluation and the oil collapse
  - {name: "2018Q4", start: "2018-10-01", end: "2018-12-31"}   # the fourth-quarter selloff
  - {name: "2020", start: "2020-01-01", end: "2020-12-31"}     # the COVID crash and its recovery
  - {name: "2022", start: "2022-01-01", end: "2022-12-31"}     # the rate shock
  - {name: "2024", start: "2024-01-01", end: "2024-12-31"}     # a calm bull year
