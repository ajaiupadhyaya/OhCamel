# INC-01's roster: the one list every producer reads (signals.daily, signals.overlay,
# desk.report). It agrees row for row with the signals block of book.example.sexp --
# slug, capital_fraction and symbols -- and research/tests/test_experiments_present.py
# holds the two to it. Fractions sum to incubation_cap exactly: two EXP-A01 rows at
# 0.0375 and 21 farm cells at 0.025 = 0.600.
#
# Not yet here, and added by a later change to both this file and the book, with every
# fraction recomputed so the sum stays incubation_cap: each intraday strategy
# (exp_i01..i03) after the owner approves its pre-registration and its battery has
# run (plan Task 23), and EXP-Q01's monthly long-short quintile portfolio
# (q01_ls_quintile, plan Task 34).
version: 1
incubation_cap: 0.60
canary_cap: 0.10
vol_target: 0.10
