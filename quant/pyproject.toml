[project]
name = "ohcamel-quant"
version = "1.0.0"
description = "OhCamel Quant: a real-data quantitative finance platform -- risk, portfolio construction, factor models, backtesting, options, rates/macro and fundamentals."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ajai Upadhyaya" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "arch>=7.0",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "respx>=0.21"]

[project.scripts]
ohcamel-quant = "ohcamel_quant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohcamel_quant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real network data sources (run in CI's live-data job, skipped offline)"]
addopts = "-m 'not live'"
