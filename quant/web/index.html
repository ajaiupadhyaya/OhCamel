<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OhCamel Quant — a real-data quantitative finance workstation." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>OhCamel Quant</title>
    <script>
      // Apply the persisted theme before first paint (no flash).
      try {
        var t = localStorage.getItem("ohcamel.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
