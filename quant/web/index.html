<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--seo:head-->
    <title>OhCamel Quant</title>
    <meta name="description" content="OhCamel Quant — a real-data quantitative finance workstation." />
    <!--/seo:head-->
    <script>
      // Apply the persisted theme before first paint (no flash).
      try {
        // Older builds stored "light" / "dark"; theme.tsx normalizeTheme does the same mapping.
        var t = localStorage.getItem("ohcamel.theme");
        if (t === "light") t = "paper";
        if (t === "dark") t = "carbon";
        if (t === "paper" || t === "carbon") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--seo:body--><!--/seo:body--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
