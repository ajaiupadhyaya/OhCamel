# The Ledger's prose rows: what was built, what was cut, and the advisory, limit and owner rows that are
# plain statements rather than state. machine/ledger.py reads this file and adds the rows it computes from
# the system (the backup's record, the desk's latest report, the two hosts' builds, the experiments'
# approval lines); GET /api/ledger serves both, and /ledger renders them.
#
# Every row carries `checked`: the date someone last checked it against the code. A row checked more than
# 45 days before the ledger's date is served stale and renders hatched. Re-check a row before re-dating it.
#
# Nothing here may state what the system can say for itself: no strategy count, no switch, no backup or
# host state, no limit threshold, no commit (tests/test_ledger.py holds this file to that). A product row
# names its job `kind`, whose latest artifact gives the row its live state on the page, and its
# Methodology entry id.
rows:
  # ---------------------------------------------------------------- built
  - {section: BUILT, item: FRONT, checked: 2026-11-05, detail: "The machine: the system's real dependency graph as a 3-D instrument, from the world's data through the jobs and products to the book, with a guided tour, the day's runs and a list form."}
  - {section: BUILT, item: TAPE, checked: 2026-11-05, detail: "The Tape: index figures, UST curve and 2s10s, regime, atlas, farm and model headlines, last night's compute, data freshness."}
  - {section: BUILT, item: MKTS, checked: 2026-11-05, detail: "Markets: indices, sectors, rates, credit, commodities, volatility, cross-asset correlation."}
  - {section: BUILT, item: RISK, checked: 2026-11-05, detail: "Portfolio VaR/ES under nine models, Euler decomposition, out-of-sample VaR backtests, GARCH; the Monte Carlo atlas."}
  - {section: BUILT, item: PORT, checked: 2026-11-05, detail: "Portfolio Lab: holdings and 13F import, performance, factors, 17 historical stress scenarios, covariance league."}
  - {section: BUILT, item: OPT, checked: 2026-11-05, detail: "Optimizer: ten methods incl. mean-variance, risk parity, HRP, HERC, min-CVaR; Black–Litterman; walk-forward against 1/N."}
  - {section: BUILT, item: RSCH, checked: 2026-11-05, detail: "Strategy Lab: twelve strategies with PBO, deflated Sharpe, SPA, bootstrap, cost curves; strategy farm; models."}
  - {section: BUILT, item: VOL, checked: 2026-11-05, detail: "Volatility: chains, parity forwards, SVI surface, risk-neutral densities, payoffs, realized vol; forecast league; surface history."}
  - {section: BUILT, item: RATES, checked: 2026-11-05, detail: "Rates & Macro: par, zero and forward curves, NS/NSS fits, PCA, recession probit, Sahm rule, policy rules, regimes."}
  - {section: BUILT, item: CO, checked: 2026-11-05, detail: "Company: SEC statements, ratios, quality scores, FCFF DCF and reverse DCF."}
  - {section: BUILT, item: GP, checked: 2026-11-05, detail: "Ticker: price history, volume, return statistics, realized volatility."}
  - {section: BUILT, item: DECK, checked: 2026-11-05, detail: "Flight Deck: the reference books' limits, risk and feeds as live instruments; the compute bank."}
  - {section: BUILT, item: SYS, checked: 2026-11-16, detail: "System index: Compute, Engine, Methodology, Ledger, each with a live status line."}
  - {section: BUILT, item: COMPUTE, checked: 2026-11-05, detail: "Host CPU by slice, steal and memory from hostd; the queue with live progress over SSE; the last 24 h with CPU seconds and peak RSS; the schedule with next runs; the kernel benchmark table."}
  - {section: BUILT, item: DOCS, checked: 2026-11-05, detail: "Methodology: every model, P1–P7, the engine, each kernel, data sources, limitations, one bibliography."}
  - {section: BUILT, item: P1 RISK ATLAS, kind: risk.mc_atlas, methodology: p1-mc-atlas, checked: 2026-11-05, detail: "Nightly 1M-path VaR/ES per reference book, FHS and t-copula, 1D and 10D, Euler split of ES; universe members FHS only; books re-measured every 15 min in session."}
  - {section: BUILT, item: P2 VOL FORECAST LEAGUE, kind: vol.forecast_league, methodology: p2-vol-league, checked: 2026-11-05, detail: "GARCH, GJR, EGARCH, HAR-RV, EWMA scored by QLIKE and MSE; Diebold–Mariano; model confidence set. Nightly."}
  - {section: BUILT, item: P3 COVARIANCE LEAGUE, kind: cov.league, methodology: p3-cov-league, checked: 2026-11-05, detail: "Seven estimators ranked weekly by the realized volatility of their minimum-variance portfolio; HAC test against the sample covariance. Descriptive only."}
  - {section: BUILT, item: P4 STRATEGY FARM, kind: farm.sweep, methodology: p4-strategy-farm, checked: 2026-11-05, detail: "Strategy Lab strategies × universes × grids up to 256, walk-forward; farm-wide DSR, PSR, CSCV PBO, SPA, costs 0/5/15/30 bps; verdict first. Nightly, 90-min budget."}
  - {section: BUILT, item: P5 CROSS-SECTIONAL MODEL, kind: models.xs_lgbm, methodology: p5-exp-q01, checked: 2026-11-05, detail: "EXP-Q01: LightGBM ETF ranker vs a linear composite, purged walk-forward, 2022 holdout evaluated once; the charter's gates decide. Monthly."}
  - {section: BUILT, item: P6 REGIME HMM, kind: regime.hmm, methodology: p6-exp-q02, checked: 2026-11-05, detail: "EXP-Q02: Gaussian HMM on four weekly features, 2–4 states by BIC; high-volatility probability vs EWMA for next-month SPY variance. Weekly."}
  - {section: BUILT, item: WATCH KRONOS SHADOW, kind: kronos.shadow, methodology: k01-kronos-shadow, checked: 2026-11-05, detail: "EXP-K01 FAILED: Kronos-small over-forecasts variance against GARCH and EWMA. The nightly shadow keeps measuring it prospectively, append-only, next to the incumbents. Sizes nothing."}
  - {section: BUILT, item: WATCH FACTOR SCREEN, kind: factors.screen, methodology: factor-workbench, checked: 2026-11-05, detail: "qlib's operators and Alpha158, ported and point-in-time; RD-Agent's loop with the owner writing every hypothesis; the trial ledger re-screened weekly on the warehouse universe, exploration window only."}
  - {section: BUILT, item: WATCH DATA INTEGRITY, kind: ops.data_integrity, methodology: data-integrity, checked: 2026-11-05, detail: "Every daily series checked nightly for unadjusted splits, bad prints, non-positive prices, calendar faults and staleness. Detects, never repairs."}
  - {section: BUILT, item: P7 SURFACE HISTORY, kind: vol.surface_history, methodology: p7-surface-history, checked: 2026-11-05, detail: "Nightly SVI per snapshot: ATM IV, 25-delta risk reversal and butterfly, term slope, model-free variance, VRP. Grows from the first snapshot."}
  - {section: BUILT, item: KERNELS, checked: 2026-11-05, detail: "Twelve Rust kernels via PyO3, each with a NumPy reference and parity tests; the image refuses to start without them; Rust vs Python benchmarks on /compute."}
  - {section: BUILT, item: JOBS, checked: 2026-11-05, detail: "Queue, worker and scheduler: immutable artifacts with provenance and data_asof; admission by hostd memory; heavy jobs one at a time outside 09:25–16:05 NY; progress over SSE."}
  - {section: BUILT, item: WAREHOUSE, checked: 2026-11-05, detail: "DuckDB written only by the worker: daily and minute bars, FRED, factors, option snapshots, SEC facts, 13F holdings; ingest log and freshness."}
  - {section: BUILT, item: HOSTD, checked: 2026-11-05, detail: "Rust host telemetry: CPU, steal, iowait, memory and per-slice use every 5 s, one hour kept."}
  - {section: BUILT, item: HARDENING, checked: 2026-11-05, detail: "Artifact reads contained to the artifact root; public job kinds pinned; per-client queue and rate limits; SSE caps; CSP measured per route."}
  - {section: BUILT, item: ENGINE, checked: 2026-11-05, detail: "OCaml incremental real-time risk engine, as deployed."}
  - {section: BUILT, item: DESK, checked: 2026-11-05, detail: "The paper desk: limits and marks on the engine's book. Paper only."}
  - {section: BUILT, item: LEDGER, checked: 2026-11-16, detail: "This page: its prose rows from one file, each with the date it was last checked; its advisory, limit and owner state computed from the system each time it is read."}
  # ---------------------------------------------------------------- cut
  - {section: CUT, item: ENGINE DEPTH, checked: 2026-11-05, detail: "Finish-plan Stages 2A–6: the long window, GARCH and Cornish–Fisher in the engine, factor and liquidity limits, option marks, self-validation, R8."}
  - {section: CUT, item: P8 SCENARIO GRID, checked: 2026-11-05, detail: "Engine-side scenario grid over the live book."}
  - {section: CUT, item: C STUBS, checked: 2026-11-05, detail: "C bindings for the engine's numeric core."}
  - {section: CUT, item: KIOSK MODE, checked: 2026-11-05, detail: "A wall-display mode of the Flight Deck."}
  - {section: CUT, item: SAVED LAYOUTS, checked: 2026-11-05, detail: "Per-route saved panel layouts."}
  - {section: CUT, item: DENSITY MODES, checked: 2026-11-05, detail: "Compact and comfortable table densities."}
  # ---------------------------------------------------------------- advisory
  - {section: ADVISORY, item: MODEL OUTPUT, checked: 2026-11-05, detail: "A research verdict does not promote a strategy. Incubation sizing is the book's, under the cap. Live sizing requires a passing battery and the owner."}
  - {section: ADVISORY, item: PRE-REGISTERED ONLY, checked: 2026-11-05, detail: "P5 and P6 run only as their approved pre-registrations; each holdout is evaluated once."}
  # ---------------------------------------------------------------- limits
  - {section: LIMITS, item: SURVIVORSHIP, checked: 2026-11-05, detail: "Universes are current constituents; delisted names are absent."}
  - {section: LIMITS, item: IEX FEED, checked: 2026-11-05, detail: "Alpaca IEX is a single venue, not the consolidated tape."}
  - {section: LIMITS, item: OPTIONS DELAYED, checked: 2026-11-05, detail: "Option quotes are Cboe delayed data; snapshot history starts on the first night and cannot be re-fetched."}
  - {section: LIMITS, item: SHARED VCPU, checked: 2026-11-05, detail: "One 2-vCPU, 4 GB droplet; CPU steal from neighbours is measured, not prevented."}
  - {section: LIMITS, item: WAREHOUSE FILE NOT COPIED, checked: 2026-11-16, detail: "The nightly backup copies the desk's journal, the recorder and jobs.sqlite, and exports the option snapshots read-only because they cannot be re-fetched. warehouse.duckdb itself is not copied; it is rebuilt from vendors."}
  - {section: LIMITS, item: ARTIFACT FILES NOT COPIED, checked: 2026-11-16, detail: "The artifacts' files are not in the nightly backup; their ledger, jobs.sqlite, is."}
  - {section: LIMITS, item: KERNEL BENCHMARKS, checked: 2026-11-05, detail: "The recorded table was measured on a developer laptop, not the droplet's CPU class; two kernels are slower in Rust there."}
  # ---------------------------------------------------------------- owner
  - {section: OWNER, item: LIVE TRADING SWITCH, checked: 2026-11-05, detail: "book.sexp on the droplet; never edited by the agent."}
  - {section: OWNER, item: EXP-Q01 UNIVERSE, checked: 2026-11-05, detail: "Frozen 2026-10-08. The I-Q01-7 dollar-volume sign stays −1 until a new experiment."}
  - {section: OWNER, item: DROPLET SIZE, checked: 2026-11-05, detail: "Resize if steal stays above 10 % or the nightly batch misses 09:00 NY."}
  - {section: OWNER, item: ENGINE BRIDGE, checked: 2026-11-05, detail: "The public /engine page's vitals carry no book data; whether the public site shows the paper book's positions is a second switch, off."}
