# Lane B's schedules (compute plan B4; ship spec section 5). Read by the worker's
# scheduler thread (jobs/schedules.py) every 30 s.
#
# max_age: how old a kind's latest artifact may be before every page that shows
# it marks it stale (ship delta, Review Focus 1). One missed run must turn the
# lamp amber, so each is a little over the kind's schedule period.
#
# schedules: one entry each -- name (unique), cron (five fields, NEW YORK wall
# time), kind (registered in jobs/kinds.py), params, priority (1 intraday,
# 2 nightly; 0 is reserved for user submissions), mem_class (S/M/L, contract
# II.2) and heavy (true = never starts 09:25-16:05 New York on a session day).
# Other lanes append their kinds' max ages and entries here.
max_age:
  ops.selftest: 26h
  ingest.fred: 30h
  # Lane C (warehouse/schedules.py MAX_AGE, copied verbatim): session kinds 78h
  # so Friday's run is not stale by Monday's; weekly kinds 204h.
  ingest.universes: 204h
  ingest.bars_daily: 78h
  ingest.bars_minute: 78h
  ingest.fred_warehouse: 30h
  ingest.factors: 204h
  ingest.sec_facts: 204h
  ingest.holdings_13f: 204h
  ingest.option_snapshots: 78h
  # Lane M (products). Nightly kinds 78h like Lane C's session kinds; intraday 35m (one missed run + slack,
  # the deck's MC_MAX_AGE_S on ship/lane-f).
  risk.mc_atlas: 78h
  risk.mc_intraday: 35m
  vol.forecast_league: 78h
  cov.league: 204h
  farm.sweep: 78h
  vol.surface_history: 78h
  models.xs_lgbm: 816h   # monthly (1st, 22:30) plus 2 days

schedules:
  - name: selftest-nightly
    cron: "5 4 * * *"
    kind: ops.selftest
    params: {tag: nightly}
    priority: 2
    mem_class: S
    heavy: false

  - name: fred-dgs10-nightly
    cron: "30 6 * * *"
    kind: ingest.fred
    params: {series: DGS10}
    priority: 2
    mem_class: S
    heavy: false

  # Lane C's warehouse ingest (compute plan C2-C6; warehouse/schedules.py
  # SCHEDULES, copied verbatim and pinned equal by tests/test_jobs_integration.py).
  # The only writers of /data/warehouse.duckdb.
  - name: warehouse-universes
    cron: "0 5 * * 0"
    kind: ingest.universes
    params: {}
    priority: 2
    mem_class: S
    heavy: false

  - name: warehouse-bars-daily
    cron: "30 18 * * 1-5"
    kind: ingest.bars_daily
    params: {}
    priority: 2
    mem_class: S
    heavy: false

  - name: warehouse-bars-minute
    cron: "0 19 * * 1-5"
    kind: ingest.bars_minute
    params: {}
    priority: 2
    mem_class: S
    heavy: false

  - name: warehouse-fred
    cron: "0 7 * * *"
    kind: ingest.fred_warehouse
    params: {}
    priority: 2
    mem_class: S
    heavy: false

  - name: warehouse-factors
    cron: "0 6 * * 6"
    kind: ingest.factors
    params: {}
    priority: 2
    mem_class: S
    heavy: false

  - name: warehouse-sec-facts
    cron: "0 2 * * 0"
    kind: ingest.sec_facts
    params: {}
    priority: 2
    mem_class: M
    heavy: true

  - name: warehouse-13f
    cron: "0 3 * * 0"
    kind: ingest.holdings_13f
    params: {}
    priority: 2
    mem_class: S
    heavy: false

  - name: warehouse-option-snapshots
    cron: "20 16 * * 1-5"
    kind: ingest.option_snapshots
    params: {underlyings: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY, SPY, QQQ, IWM, TLT, GLD, TSLA, NVDA, AAPL, AMZN, PLTR, AMD, META, MSFT, GOOGL, AVGO, MSTR, NFLX, COIN, HOOD]}
    priority: 2
    mem_class: S
    heavy: false

  # Intraday (compute plan I.4 P9: "nightly and intraday"): the minute bars'
  # incremental top-up every 30 minutes in session, 10:00-15:30 New York on
  # weekdays (a holiday finds nothing new and keeps what is stored). Light: one
  # month of one ticker in memory at most, so class S and heavy: false, which
  # admission lets run inside the session at priority 1 with 1 thread.
  - name: warehouse-bars-minute-intraday
    cron: "*/30 10-15 * * 1-5"
    kind: ingest.bars_minute
    params: {}
    priority: 1
    mem_class: S
    heavy: false

  # Lane M: P1 risk atlas, nightly after the 18:30 bars ingest; intraday every 15 min in session.
  - name: risk-atlas-nightly
    cron: "0 20 * * 1-5"
    kind: risk.mc_atlas
    params: {}
    priority: 2
    mem_class: M
    heavy: true

  - name: risk-atlas-intraday-open
    cron: "45 9 * * 1-5"
    kind: risk.mc_intraday
    params: {}
    priority: 1
    mem_class: S
    heavy: false

  - name: risk-atlas-intraday
    cron: "*/15 10-15 * * 1-5"
    kind: risk.mc_intraday
    params: {}
    priority: 1
    mem_class: S
    heavy: false

  # Lane M: P2 volatility forecast league, nightly after the daily (18:30) and minute (19:00) ingests.
  - name: vol-forecast-league
    cron: "30 21 * * 1-5"
    kind: vol.forecast_league
    params: {}
    priority: 2
    mem_class: M
    heavy: true

  # Lane M: P3 covariance league, weekly on Saturday morning.
  - name: cov-league-weekly
    cron: "0 8 * * 6"
    kind: cov.league
    params: {}
    priority: 2
    mem_class: M
    heavy: true

  # Lane M: P4 strategy farm, nightly and incremental (90-minute budget, stalest cells first).
  - name: farm-nightly
    cron: "0 23 * * 1-5"
    kind: farm.sweep
    params: {budget_minutes: 90}
    priority: 2
    mem_class: L
    heavy: true

  # Lane M: P7 option-surface history, nightly after the 16:20 snapshots.
  - name: vol-surface-history
    cron: "0 21 * * 1-5"
    kind: vol.surface_history
    params: {}
    priority: 2
    mem_class: M
    heavy: true

  # Lane M: P5 EXP-Q01 (approved pre-registration), monthly: selection and holdout once, retrain and score monthly.
  - name: exp-q01-monthly
    cron: "30 22 1 * *"
    kind: models.xs_lgbm
    params: {}
    priority: 2
    mem_class: M
    heavy: true
