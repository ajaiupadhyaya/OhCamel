# OhCamel on one droplet.
#
#   caddy         TLS termination and the only service with a host port
#   ohcamel-demo  the synthetic engine, public
#   ohcamel-live  the same image against Alpaca and FRED, password-gated
#
# The two engines have no published ports -- they are reachable only from
# caddy, over the internal network. That is what makes the basic-auth on the
# live host meaningful: without it, anyone could skip the proxy by asking the
# droplet for :8081 directly, and the password would be decoration.

name: ohcamel

x-engine: &engine
  image: ohcamel:latest
  restart: unless-stopped
  # Docker's own init as PID 1. Async installs signal handlers, but PID 1 in a
  # container does not get the default SIGTERM disposition, so without an init
  # a `docker compose down` waits the full ten seconds and then kills the
  # process -- turning every deploy into an unclean shutdown.
  init: true
  # The book is mounted rather than baked so that editing book.sexp and
  # restarting does not mean a twenty-minute rebuild. The image carries the
  # committed EXAMPLE book as a fallback, so a missing mount degrades to that
  # instead of a crash. The mount source must exist, though: Docker creates a
  # missing bind-mount source as a directory, and a directory over a file
  # fails the container. deploy.sh creates book.sexp from the example first.
  volumes:
    - ../book.sexp:/app/book.sexp:ro
  # A read-only root filesystem: the engine writes nothing to disk. Anything
  # that suddenly needs to is a change worth noticing at review time rather
  # than discovering in production.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  networks: [ohcamel]

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.snippets:/etc/caddy/Caddyfile.snippets:ro
      # Named volumes, not bind mounts: caddy_data holds the issued
      # certificates and the ACME account key. Losing it means re-issuing on
      # every restart, and Let's Encrypt rate-limits that (five per week per
      # hostname) -- a restart loop could lock the domain out for days.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      OHCAMEL_ACME_EMAIL: ${OHCAMEL_ACME_EMAIL:?set it in deploy/deploy.env}
      OHCAMEL_DEMO_HOST: ${OHCAMEL_DEMO_HOST:?set it in deploy/deploy.env}
      OHCAMEL_LIVE_HOST: ${OHCAMEL_LIVE_HOST:?set it in deploy/deploy.env}
      OHCAMEL_LIVE_USER: ${OHCAMEL_LIVE_USER:?set it in deploy/deploy.env}
      OHCAMEL_LIVE_HASH: ${OHCAMEL_LIVE_HASH:?run `caddy hash-password`}
    depends_on:
      ohcamel-demo:
        condition: service_healthy
    networks: [ohcamel]

  ohcamel-demo:
    <<: *engine
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Passed through to dune's %{env:...} inside the builder stage. Absent,
      # the image honestly says `unknown` rather than carrying a date nobody
      # set. ohcamel-live has no build block -- it runs this same image, so
      # both hosts always report the same sha, and a disagreement would mean
      # one of them did not restart.
      args:
        OHCAMEL_GIT_SHA: "${OHCAMEL_GIT_SHA:-unknown}"
        OHCAMEL_BUILT_AT: "${OHCAMEL_BUILT_AT:-unknown}"
    command: ["demo", "8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The engine builds its graph and runs a first stabilization before it
      # listens. Twenty seconds is generous for that; the cost of being
      # generous is a slower first deploy, and the cost of being tight is a
      # container killed while it was starting correctly.
      start_period: 20s

  # Behind a profile, so `docker compose up -d` brings up only the public demo
  # and `docker compose --profile live up -d` adds this. Phases 1-3 of the
  # deployment never start it, which means they never need a credential.
  ohcamel-live:
    <<: *engine
    profiles: ["live"]
    # Where the OTHER host is. /ops on the live origin fills its second column
    # from the public demo engine, which is possible only in this direction:
    # the demo engine publishes a CORS header on its JSON in demo mode, and the
    # live host publishes none and stays behind the password. The demo service
    # deliberately gets no peer -- nothing crosses the other way.
    environment:
      OHCAMEL_PEER_ORIGIN: "https://${OHCAMEL_DEMO_HOST}"
    command: ["serve", "8081"]
    # Root-owned, 0640 and group-readable by the deploy user (compose reads
    # env_file as the invoking user, not as root), outside the repository, and
    # passed as environment rather than copied. Nothing about these three keys
    # should ever be able to reach an image layer or a git object.
    env_file:
      - path: /etc/ohcamel/live.env
        required: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  ohcamel:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
