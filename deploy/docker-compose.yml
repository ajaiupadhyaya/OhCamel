# OhCamel on one droplet.
#
#   caddy          TLS termination and the only service with a host port
#   ohcamel-quant  OhCamel Quant (FastAPI + React), the PUBLIC site: real
#                  market data only (Alpaca/Yahoo/Stooq, FRED, Cboe, SEC,
#                  Ken French), no synthetic feed anywhere
#   ohcamel-live   the OCaml engine against Alpaca and FRED, password-gated
#                  (profile "live")
#   ohcamel-demo   the OCaml engine on its SYNTHETIC feed -- no longer public;
#                  behind profile "demo", for the localhost harness only
#   ohcamel-hostd  host telemetry (native/hostd, Rust): CPU, steal, memory and
#                  per-slice use, read by ohcamel-quant at /api/ops/host
#
# None of the app containers publishes a port -- they are reachable only from
# caddy, over the internal network. That is what makes the basic-auth on the
# live host meaningful: without it, anyone could skip the proxy by asking the
# droplet for :8081 directly, and the password would be decoration.
#
# Images are PULLED, never built here. Every OhCamel image is
# ghcr.io/ajaiupadhyaya/<name>:${OHCAMEL_TAG}, and the tag is a commit sha:
# CI's image job builds the three and publishes them for every green main
# (.github/workflows/image.yml), and deploy.sh passes the sha per command, so
# a deploy names exactly one immutable image and a rollback is the previous
# sha. There is no build block in this file and no `latest` anywhere: `latest`
# named whatever was built last, so nothing could be rolled back to, and a
# build on the droplet took twenty minutes beside the live engine. The build
# blocks live in docker-compose.local.yml (the localhost harness, tag `local`);
# the image job's own override is docker-compose.ci.yml (the sha tags it just
# loaded, no build). deploy/test/compose_tags_test.sh pins all of that
# against real renders.

name: ohcamel

# One logging block for every long-running service, caddy included: json-file,
# rotated at 10 MB x 3, so no container's log grows without bound under the
# daemon's default driver. The journal, not a log, is the audit record of
# orders and fills; a log is for the last few hours of diagnosis.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-engine: &engine
  # Pulled at the sha deploy.sh passes; the :? refuses a render with no tag
  # rather than quietly naming a `latest`. OHCAMEL_IMAGE exists for a mirror
  # or a private registry of the same image and re-points the engine only --
  # the research and quant refs below are fixed names.
  image: "${OHCAMEL_IMAGE:-ghcr.io/ajaiupadhyaya/ohcamel}:${OHCAMEL_TAG:?deploy.sh sets OHCAMEL_TAG}"
  restart: unless-stopped
  # Docker's own init as PID 1. Async installs signal handlers, but PID 1 in a
  # container does not get the default SIGTERM disposition, so without an init
  # a `docker compose down` waits the full ten seconds and then kills the
  # process -- turning every deploy into an unclean shutdown.
  init: true
  # The book is mounted rather than baked so that editing book.sexp and
  # restarting does not mean a twenty-minute rebuild. The image carries the
  # committed EXAMPLE book as a fallback, so a missing mount degrades to that
  # instead of a crash. The mount source must exist, though: Docker creates a
  # missing bind-mount source as a directory, and a directory over a file
  # fails the container. deploy.sh creates book.sexp from the example first.
  volumes:
    - ../book.sexp:/app/book.sexp:ro
  # A read-only root filesystem: the engine writes nothing to disk except the
  # live engine's journal, on its own volume. Anything else that suddenly needs
  # to is a change worth noticing at review time rather than discovering in
  # production.
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging: *logging
  networks: [ohcamel]

services:
  caddy:
    # An exact version, never the floating 2-alpine: CI's lint job validates
    # both Caddyfiles inside this same image and fails when the two name
    # different versions, and deploy/deploy.env.example hashes the dashboard
    # password with it, so the hash is made by the binary that checks it.
    # Bumping it is bumping all three lines together;
    # deploy/test/compose_tags_test.sh holds them equal.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    init: true
    # The resource tiers of the compute plan (docs/superpowers/plans/
    # 2026-09-24-quant-compute-program.md I.3), one block per service:
    # cgroup_parent places the container in a systemd slice (rt, web, batch),
    # cpu_shares is its weight under contention only (an idle engine leaves
    # its cores to whoever wants them), mem_limit is a cap, not a reservation
    # (the caps add up to more than the box on purpose), and oom_score_adj
    # ranks who the kernel's OOM killer reaches first: the batch tier, then
    # the API, never the engine. Assumes Docker's systemd cgroup driver on
    # cgroup v2 (owner check O-3: `docker info --format '{{.CgroupDriver}}
    # {{.CgroupVersion}}'` prints `systemd 2`); with cgroupfs the slice names
    # become /ohcamel-rt, /ohcamel-web and /ohcamel-batch. Pinned by
    # deploy/test/resource_budget_test.sh.
    cgroup_parent: ohcamel-web.slice
    cpu_shares: 1024
    mem_limit: 128m
    oom_score_adj: -500
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.snippets:/etc/caddy/Caddyfile.snippets:ro
      # Named volumes, not bind mounts: caddy_data holds the issued
      # certificates and the ACME account key. Losing it means re-issuing on
      # every restart, and Let's Encrypt rate-limits that (five per week per
      # hostname) -- a restart loop could lock the domain out for days.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      OHCAMEL_ACME_EMAIL: ${OHCAMEL_ACME_EMAIL:?set it in deploy/deploy.env}
      OHCAMEL_DEMO_HOST: ${OHCAMEL_DEMO_HOST:?set it in deploy/deploy.env}
      OHCAMEL_LIVE_HOST: ${OHCAMEL_LIVE_HOST:?set it in deploy/deploy.env}
      OHCAMEL_LIVE_USER: ${OHCAMEL_LIVE_USER:?set it in deploy/deploy.env}
      OHCAMEL_LIVE_HASH: ${OHCAMEL_LIVE_HASH:?run `caddy hash-password`}
    # The public host is the Quant app now; Caddy starts once it answers.
    depends_on:
      ohcamel-quant:
        condition: service_healthy
    networks: [ohcamel]

  # The public site. Real data only: every number comes from a vendor through
  # MarketData, cached on the quant_data volume, or -- when a vendor is down --
  # from the committed real fixtures baked into the image; never a simulation.
  ohcamel-quant:
    image: "ghcr.io/ajaiupadhyaya/ohcamel-quant:${OHCAMEL_TAG:?deploy.sh sets OHCAMEL_TAG}"
    restart: unless-stopped
    init: true
    # OPTIONAL, unlike the live engine's: present on the droplet, the Alpaca
    # data keys in it (ALPACA_API_KEY / ALPACA_SECRET_KEY, mapped onto the
    # APCA_* names Settings reads by the image's entrypoint, or APCA_* given
    # directly) make Alpaca the first price source and FRED_API_KEY is used if
    # set. Absent -- a fresh host, the localhost harness, CI -- the app runs on
    # the keyless public sources (Yahoo/Stooq, fredgraph.csv) instead.
    env_file:
      - path: /etc/ohcamel/live.env
        required: false
    environment:
      OHCAMEL_QUANT_DATA_DIR: /data
      # The read-only bridge to the OCaml engine (api/routers/engine.py): GET
      # /api/health, /api/ops, /api/snapshot, /api/history only, over the
      # internal network, so the public /engine page can show it. Unreachable
      # (live profile not running) is a 503 the page renders, not an error.
      # OFF by default: the snapshot carries the paper book's positions, which
      # have only ever been shown behind the live host's password. To publish
      # them on the public /engine page, set in deploy/.env:
      #   OHCAMEL_QUANT_ENGINE_URL=http://ohcamel-live:8081
      OHCAMEL_QUANT_ENGINE_URL: "${OHCAMEL_QUANT_ENGINE_URL-}"
      # Host telemetry (api/routers/ops.py -> ohcamel-hostd below), served at
      # /api/ops/host. On by default: it carries no positions, only the box's
      # CPU and memory. Set OHCAMEL_QUANT_HOSTD_URL= in deploy/.env to turn
      # the proxy off (the route then answers 503).
      OHCAMEL_QUANT_HOSTD_URL: "${OHCAMEL_QUANT_HOSTD_URL-http://ohcamel-hostd:9100}"
      # The Flight Deck's recorder (api/routers/deck.py): one reading of the
      # reference book a minute while the US session is open, into
      # /data/deck/recorder.sqlite on the quant_data volume, pruned to 30
      # sessions (~12k small rows). Set OHCAMEL_QUANT_RECORDER=0 in deploy/.env
      # to turn it off; the /deck page then says the tape is not recorded.
      OHCAMEL_QUANT_RECORDER: "${OHCAMEL_QUANT_RECORDER:-1}"
      # SEC EDGAR's fair-access policy requires a User-Agent naming a contact.
      # Defaults to the ACME contact the owner already reads.
      OHCAMEL_QUANT_USER_AGENT: "${OHCAMEL_QUANT_USER_AGENT:-OhCamel-Quant/1.0 (research; contact: ${OHCAMEL_ACME_EMAIL:-unset})}"
    # The Parquet cache and provenance sidecars; everything else is read-only.
    # A named volume so a rebuild keeps the cache and vendors are not
    # re-hammered on every deploy.
    volumes:
      - quant_data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # A 2 vCPU / 4 GB droplet shared with Caddy, the live engine and the
    # research service. pandas/scipy on ten years of daily bars for a 60-name
    # universe fits comfortably in this; a runaway request is killed and
    # restarted rather than taking the engine down with it. 1536m until heavy
    # requests go through the worker (compute plan Lane B, B5), which lowers
    # it to 1024m. OOM rank 0: after the batch tier, before caddy and the
    # engine (tiers above caddy's).
    cgroup_parent: ohcamel-web.slice
    cpu_shares: 1024
    mem_limit: 1536m
    oom_score_adj: 0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Importing numpy/pandas/scipy/statsmodels and mounting every router.
      start_period: 30s
    logging: *logging
    networks: [ohcamel]

  # Host telemetry (compute plan Task 0.4, contract II.6): a static Rust
  # binary in a scratch image that samples /proc and the three slices above
  # every 5 s and answers GET /v1/host on the internal network only (no host
  # port). ohcamel-quant proxies it at /api/ops/host, and the worker's
  # admission control (Lane B) reads mem_available from it. /proc and the
  # cgroup tree are mounted read-only; the image runs as nobody. In the
  # default profile, beside caddy and ohcamel-quant, because the public site
  # shows it. Without the systemd cgroup driver (owner check O-3), set
  # HOSTD_GROUPS to the cgroupfs names (/ohcamel-rt, ...).
  ohcamel-hostd:
    image: "ghcr.io/ajaiupadhyaya/ohcamel-hostd:${OHCAMEL_TAG:?deploy.sh sets OHCAMEL_TAG}"
    restart: unless-stopped
    # Docker's init as PID 1, as for every other service: a Rust binary as
    # PID 1 does not get SIGTERM's default disposition, and a `down` would
    # wait out its ten seconds.
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cgroup_parent: ohcamel-web.slice
    cpu_shares: 1024
    mem_limit: 32m
    oom_score_adj: -500
    environment:
      HOSTD_GROUPS: "${HOSTD_GROUPS:-ohcamel-rt.slice,ohcamel-web.slice,ohcamel-batch.slice}"
    volumes:
      - /proc:/host/proc:ro
      - /sys/fs/cgroup:/host/sys/fs/cgroup:ro
    logging: *logging
    networks: [ohcamel]

  # The synthetic engine. It used to be the public site; the owner's rule for
  # the public site is now real data only, so it is behind a profile and never
  # started by a plain `docker compose up -d`. The localhost harness enables
  # it (--profile demo) to exercise the engine and the streaming proxy
  # without credentials; deploy.sh stops and removes any container of it left
  # over from before.
  ohcamel-demo:
    <<: *engine
    profiles: ["demo"]
    command: ["demo", "8080"]
    # The localhost harness only; the same budget as the live engine.
    cgroup_parent: ohcamel-rt.slice
    cpu_shares: 4096
    mem_limit: 512m
    oom_score_adj: -800
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The engine builds its graph and runs a first stabilization before it
      # listens. Twenty seconds is generous for that; the cost of being
      # generous is a slower first deploy, and the cost of being tight is a
      # container killed while it was starting correctly.
      start_period: 20s

  # Behind a profile, so `docker compose up -d` brings up only the public site
  # (caddy + ohcamel-quant) and `docker compose --profile live up -d` adds this. Phases 1-3 of the
  # deployment never start it, which means they never need a credential.
  ohcamel-live:
    <<: *engine
    profiles: ["live"]
    # The protected tier: the heaviest CPU weight on the box, 256m that is
    # always its own, and the lowest OOM rank of anything here.
    cgroup_parent: ohcamel-rt.slice
    cpu_shares: 4096
    mem_limit: 512m
    mem_reservation: 256m
    oom_score_adj: -800
    # No OHCAMEL_PEER_ORIGIN any more. /ops on the live origin used to fill its
    # second column from the public demo engine's /api/ops; the public host is
    # the Quant app now and serves no /api/ops, so a peer pointing there would
    # only ever read "unreachable". Unset, the page says "no peer configured",
    # which is the truth.
    environment:
      OHCAMEL_JOURNAL: /data/desk.db
      # Task 16: where ohcamel-research writes one signal a strategy a
      # trading day. Read-only here -- the engine only ever lists and opens
      # what is already there (desk/intake.ml); ohcamel-research below is the
      # only writer, on the same named volume mounted read-write at /signals.
      # A fresh volume starts empty, and Intake.directory (desk/intake.ml)
      # only refuses a set-but-EMPTY-STRING variable or an unreadable/
      # non-directory path -- Sys_unix.readdir succeeds on an empty
      # directory -- so the live engine starts cleanly before the first
      # 19:15 run has written anything (see docs/status.md and this task's
      # report for the empty-directory finding this line depends on).
      OHCAMEL_SIGNALS_DIR: /data/signals
    # The book, as for every engine, and the journal: the one writable mount
    # (design §3.5). A named volume, so a rebuild or a `down` keeps the record;
    # deleting the volume deletes it. signals is read-only here on purpose --
    # see OHCAMEL_SIGNALS_DIR above.
    volumes:
      - ../book.sexp:/app/book.sexp:ro
      - desk_data:/data
      - signals:/data/signals:ro
    command: ["serve", "8081"]
    # Root-owned, 0640 and group-readable by the deploy user (compose reads
    # env_file as the invoking user, not as root), outside the repository, and
    # passed as environment rather than copied. Nothing about these three keys
    # should ever be able to reach an image layer or a git object.
    env_file:
      - path: /etc/ohcamel/live.env
        required: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Task 16: computes each registered strategy's weight once a trading day
  # from 19:15 America/New_York (in practice 00:16 UTC, once the fetch's end
  # is clear of Alpaca's 15-minute SIP window -- see service.py), from its
  # manifest's selected_params, and writes it where ohcamel-live reads it
  # (above). Behind the same "live"
  # profile as ohcamel-live -- it has nothing to compute for the demo
  # engine, which registers no strategies -- and never started, and no
  # credential needed, in phases 1-3 of the deployment (same reasoning as
  # ohcamel-live's own profile comment).
  ohcamel-research:
    image: "ghcr.io/ajaiupadhyaya/ohcamel-research:${OHCAMEL_TAG:?deploy.sh sets OHCAMEL_TAG}"
    restart: unless-stopped
    init: true
    profiles: ["live"]
    # The batch tier: preemptible by weight and the first thing the OOM
    # killer reaches.
    cgroup_parent: ohcamel-batch.slice
    cpu_shares: 256
    mem_limit: 384m
    oom_score_adj: 500
    # The live engine's own env_file (its trading keys are simply never
    # read by this service -- fdq's Settings reads only ALPACA_API_KEY and
    # ALPACA_SECRET_KEY, the *data* keys; recorded as a known Minor in the
    # plan). One file, one place credentials are granted from, rather than a
    # second copy of the same three lines maintained here.
    env_file:
      - path: /etc/ohcamel/live.env
        required: true
    environment:
      # fdq's own bar cache and its yfinance cross-validation log both
      # default to ./data (fdq.util.settings.Settings), which a read-only
      # root filesystem (below) would refuse to create. Redirected to the
      # tmpfs. The service never shares a cache across fetches: each fetch
      # gets a fresh directory inside this one, deleted when it returns
      # (service.py's AlpacaBarSource), so no row from an earlier, refused
      # fetch can reach a later one.
      FDQ_DATA_DIR: /tmp/fdq-data
    volumes:
      - signals:/signals
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Task 18: the poll loop stamps /tmp/ohcamel-research.heartbeat at the
    # top of every poll and after every run (service.py's HEARTBEAT_PATH),
    # and this fails once it is more than 900 s old (HEARTBEAT_MAX_AGE_S) or
    # absent -- the one way to see a loop that stopped turning, since a loop
    # waiting for 19:15 is silent for hours by design. Stdlib-only Python, so
    # a check a minute never imports pandas. deploy/watch.sh restarts the
    # container after three consecutive unhealthy runs and alerts.
    # research/tests/test_service.py holds the path and the limit to
    # service.py's.
    healthcheck:
      test: ["CMD", "/app/research/.venv/bin/python", "-c", "import os, sys, time; p = '/tmp/ohcamel-research.heartbeat'; sys.exit(1 if not os.path.exists(p) or time.time() - os.path.getmtime(p) > 900 else 0)"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The file is stamped before the start-up back-fill runs, so this is
      # only the interpreter starting.
      start_period: 30s
    logging: *logging
    networks: [ohcamel]

  # The nightly backup's container (finish plan ruling 11, Task 14), behind
  # profile "backup" so no `up` ever starts it: deploy/backup.sh runs it once
  # per line of deploy/backup.list, as `docker compose --profile backup run
  # --rm -T --user UID:GID ohcamel-backup ...`, from ohcamel-backup.timer at
  # 06:30 UTC. The same engine image and tag as ohcamel-live -- `ohcamel
  # journal-backup` is the engine's own command, and the sqlite3 CLI for the
  # files the engine does not own (the Flight Deck's recorder) is installed
  # in the same runtime stage (deploy/Dockerfile) so this stays one image.
  #
  # One volume at /data, chosen per run: OHCAMEL_BACKUP_VOLUME names the
  # compose volume the list line lives on (desk_data for the journal, which
  # is the default so `--profile backup config` renders the journal's
  # configuration; quant_data for the recorder), so a run can read exactly the
  # volume its line names and no other, and the line's path is literally the
  # path inside that volume. Read-write, not :ro, because a WAL reader may
  # have to create the -shm beside the database even though it only reads
  # (ruling 11); the container runs as the volume's owning uid for the same
  # reason. /var/backups/ohcamel on the host is /backups, the one place
  # anything is written; OHCAMEL_BACKUP_DIR re-points it for a test.
  #
  # No network, a read-only root, no env_file: nothing here reaches Alpaca,
  # and the trading keys in /etc/ohcamel/live.env are never mounted or copied
  # (backup.sh copies book.sexp and deploy/.env beside the backups; never
  # live.env). deploy/restore.sh runs this same service as root to put a
  # verified copy back into the volume. SQLite's integrity_check on a big
  # copy may spill to a temp file; the root is read-only, so that goes to the
  # tmpfs.
  ohcamel-backup:
    image: "${OHCAMEL_IMAGE:-ghcr.io/ajaiupadhyaya/ohcamel}:${OHCAMEL_TAG:?deploy.sh sets OHCAMEL_TAG}"
    profiles: ["backup"]
    init: true
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      SQLITE_TMPDIR: /tmp
    volumes:
      - "${OHCAMEL_BACKUP_VOLUME:-desk_data}:/data"
      - "${OHCAMEL_BACKUP_DIR:-/var/backups/ohcamel}:/backups"
    logging: *logging
    command: ["journal-backup", "/data/desk.db", "/backups"]

networks:
  ohcamel:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  # OhCamel Quant's data cache: fetched vendor datasets as Parquet plus a JSON
  # provenance sidecar each. Disposable (deleting it only means refetching),
  # but kept across rebuilds so a deploy does not re-download everything.
  quant_data:
  desk_data:
  # Task 16: one JSON signal a strategy a trading day, written by
  # ohcamel-research (read-write, above) and read by ohcamel-live
  # (read-only, above). Named, not a bind mount, for the same reason
  # desk_data is: a rebuild or a `down` keeps every signal ever written.
  # Owned by uid 10001 however it is first seeded: both images carry their
  # mount point (/signals, /data/signals) owned by that uid, research runs
  # as it, and the image job proves both orders on fresh volumes (finish
  # plan Task 11).
  signals:
