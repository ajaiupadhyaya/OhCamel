name: debug-sec-xom
on:
  push:
    branches: [claude/debug-sec-xom]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/modest-dijkstra-4i10yq
      - uses: astral-sh/setup-uv@v5
      - working-directory: quant
        run: |
          uv sync --frozen -q
          curl -sS -A "OhCamel-Quant/1.0 (research; contact: ohcamel@ajaiupadhyaya.com)" \
            https://data.sec.gov/api/xbrl/companyfacts/CIK0000034088.json -o /tmp/xom.json
          OHCAMEL_QUANT_DATA_DIR=/tmp/qd uv run --frozen python - <<'PY'
          import traceback, logging
          logging.basicConfig(level=logging.INFO)
          from ohcamel_quant.data.market import MarketData
          m = MarketData()
          for t in ["AAPL", "MSFT", "JPM", "XOM"]:
              try:
                  d = m.company_facts(t).data
                  print("OK", t, d["cik"], d["name"], d["annual"].shape, d["shares_outstanding"], d.get("shares_outstanding_tag"))
              except Exception:
                  print("FAIL", t); traceback.print_exc()
          from ohcamel_quant.data import sec
          print("resolve XOM ->", sec.resolve("XOM", m.settings))
          PY
