name: ci

on:
  push:
    # main, and the stage branches. A stage is accepted only when CI is green
    # on it BEFORE it merges, and this project merges by fast-forward rather
    # than through a pull request -- so with `main` alone, the first run that
    # ever saw a stage's commits would be the one on main after the merge, and
    # "green in CI before the merge" would be a claim about a run that had not
    # happened yet.
    branches:
      - main
      - 'desk/**'
      - 'final/**'
  pull_request:
  workflow_dispatch:

# Least privilege, stated once for every job rather than per job. Nothing here
# writes to the repository: the jobs read the checkout, run local scripts, and
# upload an artifact (which needs no repository scope). The default when a
# workflow says nothing at all is whatever the repository's Actions setting
# happens to be, which for a repository created before GitHub changed that
# default is read/write -- so saying it here is the difference between least
# privilege and luck. A job that genuinely needs more declares its own
# `permissions:` block, which REPLACES this one: Task 11's image job will need
# `packages: write` to push to ghcr, and that exception will then be visible at
# the job taking it rather than granted to every job in the file.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Only collapse superseded PR runs. A push to main must never cancel main's
  # own last recorded result — that is how an Actions tab ends up showing a
  # cancellation as its newest outcome.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Stage 0, not Stage 1: deploy.sh reaches the owner for the overdue W2/A3
  # deploy the moment this branch merges, so the check on it has to exist
  # before that, not in a later stage's plan.
  #
  # Everything this job runs is a parser: shellcheck over the shell, compose's
  # own renderer over the three compose files, caddy's Caddyfile adapter,
  # systemd's unit parser, and a grep-only script over three sentences. None of
  # it needs a toolchain, a daemon on the host, or a credential, which is why
  # it finishes in a couple of minutes and why it can be the check that gates a
  # deploy. It reads the checkout and nothing else -- the workflow's top-level
  # `permissions: contents: read` is all it gets.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest normally carries shellcheck already; installed here only
      # if a runner image ever drops it, so this step is never the reason the
      # job is red.
      - name: shellcheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y shellcheck
          fi
          shellcheck --version

          # nullglob so an empty deploy/, deploy/test/ or scripts/ drops out
          # of the argument list instead of being passed to shellcheck as a
          # literal, missing filename -- scripts/ held nothing before
          # scripts/check-counts.sh, and the same could happen again if a
          # script under any of the three ever moves. The check below still
          # catches the case where every glob comes up empty.
          shopt -s nullglob
          files=(deploy/*.sh deploy/test/*.sh scripts/*.sh)
          shopt -u nullglob
          if [ ${#files[@]} -eq 0 ]; then
            echo "no shell scripts found under deploy/, deploy/test/ or scripts/ -- this check would lint nothing"
            exit 1
          fi
          printf 'linting:\n'
          printf '  %s\n' "${files[@]}"
          # -S warning: this repo's existing scripts carry a few info-level
          # notes (SC1091 on a sourced /etc/os-release, SC2015 on `A && B ||
          # C` used for its short-circuit rather than as if/else) that are not
          # bugs. warning and above is where a seeded mistake -- an unquoted
          # expansion, a genuinely wrong test -- actually shows up.
          shellcheck -S warning "${files[@]}"

      # Every hand-written guard test in deploy/test/, run and required to
      # pass. Today that is deploy_guard_test.sh (deploy.sh's market-hours
      # guard); a later task's own test lands here the same way, by adding
      # another file under deploy/test/, with no change to this step.
      - name: deploy/test/*.sh
        run: |
          shopt -s nullglob
          tests=(deploy/test/*.sh)
          shopt -u nullglob
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no deploy/test/*.sh found -- this check would run nothing"
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "== $t =="
            bash "$t" || status=1
          done
          exit "$status"

      # The three published test-count sentences (README.md, docs/overview.md,
      # docs/status.md), checked against lib/verified.ml and
      # research/src/ohcamel_research/verified.py by scripts/check-counts.sh.
      # This runner has no opam switch and no uv project set up, which is the
      # point: the script is grep and sed only, so this is the CI fact that
      # makes ruling 22 ("a count is a CI fact") and Definition of Done #3
      # true, on every push, without needing either toolchain.
      - name: make check-counts
        run: make check-counts

      # The compose files render. Not a substitute for bringing the stack up --
      # Task 10's image job does that against real images -- but `config` is the
      # step that catches an unknown key, an anchor that no longer merges, an
      # `!override` in the wrong place and an unset `${VAR:?...}`, and it
      # catches them in seconds on a runner that has pulled no image at all. It
      # is worth having separately from the harness because a compose file that
      # does not parse takes BOTH hosts down at once on the droplet, and
      # `deploy.sh` would discover it after it had already stopped them.
      #
      # The five hostname/ACME/basic-auth variables come from deploy/local.env,
      # which is committed for exactly this kind of use (see its own header).
      # Values invented here would be a second copy of the same five lines to
      # keep in step with the `${VAR:?...}` declarations.
      #
      # /etc/ohcamel/live.env is written with DUMMY values because both
      # ohcamel-live and ohcamel-research declare it `required: true`, so the
      # live profile does not render without it -- and a check that skipped the
      # live profile would skip the only two services that carry credentials,
      # a volume mounted read-only against another service's read-write, and
      # the env_file declaration itself. Nothing here is a credential: the
      # runner has none, and these three values are visibly fake.
      #
      # `config -q` and not `config`: the quiet form prints nothing. The verbose
      # form inlines every variable it resolved, env_file included, which on
      # this runner would only echo the dummies above but is the wrong habit to
      # write into a file that a later task may copy for the live host.
      - name: The compose files render
        run: |
          sudo install -d -m 0755 /etc/ohcamel
          printf '%s\n' \
            '# CI only. Dummy values, so that `docker compose config` can' \
            '# render the live profile, whose env_file is required: true.' \
            '# The real file is root-owned and 0640 on the droplet.' \
            'ALPACA_API_KEY=ci-dummy-not-a-key' \
            'ALPACA_SECRET_KEY=ci-dummy-not-a-key' \
            'FRED_API_KEY=ci-dummy-not-a-key' \
            | sudo tee /etc/ohcamel/live.env >/dev/null
          sudo chmod 0644 /etc/ohcamel/live.env

          docker compose version

          base=(--env-file deploy/local.env -f deploy/docker-compose.yml)

          echo "== base, default profile (caddy + ohcamel-demo)"
          docker compose "${base[@]}" config -q
          echo "== base, live profile (adds ohcamel-live + ohcamel-research)"
          docker compose "${base[@]}" --profile live config -q
          echo "== base + the localhost harness override (make deploy-verify)"
          docker compose "${base[@]}" -f deploy/docker-compose.local.yml config -q

          # Task 9 adds deploy/docker-compose.ci.yml -- the image job's own
          # override, which names the sha tags buildx loaded and carries no
          # build block. The guard is a file test rather than a committed stub:
          # a stub would exist only to keep this check busy, and would render
          # cleanly while proving nothing. This turns itself on the moment the
          # real file lands, and says out loud when it is skipping.
          if [ -f deploy/docker-compose.ci.yml ]; then
            echo "== base + the CI override, both profiles"
            docker compose "${base[@]}" -f deploy/docker-compose.ci.yml config -q
            docker compose "${base[@]}" -f deploy/docker-compose.ci.yml --profile live config -q
          else
            echo "-- deploy/docker-compose.ci.yml does not exist yet (Task 9 creates it); skipped"
          fi

      # Both Caddyfiles adapt and provision. This is the only check that reads
      # deploy/Caddyfile.snippets the way the running proxy does: both files
      # import it, so one broken snippet breaks production AND the harness, and
      # it would otherwise surface on the droplet, where Caddy refuses to start
      # and takes both hosts with it.
      #
      # The image is pinned, because a floating caddy:2-alpine would mean this
      # step validates against whichever version the runner happened to pull.
      # It has to be the version compose runs, or it is validating a different
      # program than the one that will read these files -- the assertion at the
      # end of the step is what keeps the two from drifting apart silently.
      #
      # The environment is dummies: deploy/Caddyfile takes its hostnames, ACME
      # contact and basic-auth credential from {$VAR} (which is Caddy's own
      # env-var syntax, expanded when the Caddyfile is adapted, not shell
      # interpolation). OHCAMEL_LIVE_HASH is a real, well-formed bcrypt string
      # -- the example from Caddy's basic_auth documentation, a hash of a
      # throwaway password nothing here knows -- rather than a placeholder
      # word, because this step adapts and provisions the site and a validator
      # should be handed the SHAPE of value the running proxy gets.
      #
      # Caddyfile.local needs no environment at all: it hardcodes
      # http://localhost. And --adapter caddyfile is explicit for both, because
      # Caddy infers the adapter from a file named exactly "Caddyfile" and
      # "Caddyfile.local" is not that.
      - name: caddy validate
        run: |
          # Keep in step with deploy/docker-compose.yml's caddy image; the
          # assertion below fails if they ever name different exact versions.
          caddy_image=caddy:2.11.4-alpine

          docker run --rm \
            -v "$PWD/deploy:/etc/caddy:ro" \
            -e OHCAMEL_ACME_EMAIL=ci@example.invalid \
            -e OHCAMEL_DEMO_HOST=demo.example.com \
            -e OHCAMEL_LIVE_HOST=live.example.com \
            -e OHCAMEL_LIVE_USER=ci \
            -e 'OHCAMEL_LIVE_HASH=$2a$14$Zkx19XLiW6VYouLHR5NmfOFU0z2GTNmpkT/5qqR7hx4IjWJPDhjvG' \
            "$caddy_image" \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

          docker run --rm \
            -v "$PWD/deploy:/etc/caddy:ro" \
            "$caddy_image" \
            caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile.local

          # Drift. Task 9 pins compose's caddy to an exact 2.x version; until it
          # does, compose still says caddy:2-alpine and this step says so rather
          # than failing on a mismatch that is not yet anyone's mistake.
          compose_caddy=$(grep -oE 'image: caddy:[0-9A-Za-z.+_-]+' deploy/docker-compose.yml \
                          | head -n 1 | sed 's/^image: //')
          if [ -z "$compose_caddy" ]; then
            echo "no caddy image found in deploy/docker-compose.yml -- this step no longer knows which caddy it is validating for"
            exit 1
          fi
          echo "validated with $caddy_image; compose runs $compose_caddy"
          case "$compose_caddy" in
            "$caddy_image")
              ;;
            caddy:2-alpine)
              echo "-- compose's caddy tag still floats (Task 9 pins it); once pinned it must equal $caddy_image"
              ;;
            *)
              echo "compose runs $compose_caddy but this step validated with $caddy_image -- pin both to the same version"
              exit 1
              ;;
          esac

      # The systemd units parse. Task 14 creates ohcamel-backup.{service,timer}
      # and Task 18 creates ohcamel-watch.{service,timer}; until they exist this
      # step says it found none and passes. The guard is a glob, not a stub unit
      # committed to keep a check busy, so this turns itself on when they land.
      #
      # The exit code is deliberately NOT the assertion, and that is the whole
      # subtlety of this step. systemd-analyze on a GitHub runner complains
      # about things that are true only of the droplet -- `User=ohcamel` does
      # not exist here, nor do the units these depend on -- and it exits
      # non-zero for some of them. What CAN be asserted from a runner is the
      # PARSE: a directive systemd does not know (`Unknown lvalue`), a section
      # it does not know, a section header that is not one, or a value it cannot
      # read. Those are exactly the mistakes a unit file in a git repository
      # carries, they are fatal on the host, and they are invisible until
      # `systemctl daemon-reload` says so at 06:30 UTC.
      - name: systemd-analyze verify (deploy/systemd/)
        run: |
          shopt -s nullglob
          units=(deploy/systemd/*.service deploy/systemd/*.timer)
          shopt -u nullglob
          if [ "${#units[@]}" -eq 0 ]; then
            echo "-- no units under deploy/systemd/ yet (Task 14 and Task 18 create them); skipped"
            exit 0
          fi
          systemd-analyze --version | head -n 1
          status=0
          for u in "${units[@]}"; do
            echo "== $u"
            # `|| true` because the exit code is not the assertion (above), and
            # because a bare assignment whose command fails would otherwise end
            # the step before the output could be read: GitHub runs an
            # unqualified `run:` block as `bash -e {0}`, so -e would propagate
            # systemd-analyze's own non-zero exit as a step failure.
            out=$(systemd-analyze verify "$u" 2>&1) || true
            printf '%s\n' "$out"
            if printf '%s\n' "$out" \
               | grep -qE 'Failed to parse|Unknown lvalue|Invalid section|Unknown section'; then
              echo "$u does not parse (see above) -- systemd would refuse it on the host."
              status=1
            fi
          done
          exit "$status"

  build-and-test:
    # Two platforms, and the second one is not decoration. The Makefile carries
    # two long write-ups of Owl bugs that only appear on arm64 macOS — a clang
    # segfault above -O1, and OpenMP code compiled against a runtime Owl never
    # links — with a workaround for each. Prose describing a workaround that
    # nothing runs is a claim, not a fact. The macOS leg below exports exactly
    # the two variables the Makefile sets, so a run of this workflow is evidence
    # that the documented workaround still works on a machine that is not the
    # author's.
    strategy:
      # A macOS failure must not cancel the Linux leg. If the Owl workaround
      # stops working, the useful information is "Linux is fine and macOS is
      # not", which fail-fast would destroy.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Generous, because Owl is built from source on both platforms and it is
    # slow. The default 360 would hide a genuine hang; 60 will not.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The launchd plist that runs deploy/pull-backups.sh on the owner's
      # laptop, linted by the tool that will actually load it. This lives on the
      # macOS leg and can live nowhere else: plutil is part of macOS and is not
      # present on an ubuntu runner at all, so the same step on the Linux leg
      # would either fail for want of the tool or quietly check nothing.
      #
      # Task 14 creates the file. Until it does, this says it found nothing and
      # passes -- a file test rather than a stub plist, which would exist only
      # to keep a check busy. It runs before the forty-minute Owl build because
      # it costs a second.
      - name: plutil -lint the launchd plist (macOS only)
        if: runner.os == 'macOS'
        run: |
          plist=deploy/launchd/com.ohcamel.pull-backups.plist
          if [ ! -f "$plist" ]; then
            echo "-- $plist does not exist yet (Task 14 creates it); skipped"
            exit 0
          fi
          plutil -lint "$plist"

      # The two pages, the three crisis CSVs and the quoted tables are OCaml
      # quoted string literals: lib/dune cats web/* and docs/crisis/*.csv into
      # generated modules using delimiters of the form
      # {ohcamel_NAME|...|ohcamel_NAME}. A CLOSING delimiter inside one of
      # those sources ends the literal early. In practice the trailing bytes
      # are then not valid OCaml and the build fails — but it fails inside a
      # GENERATED file, at a line number nobody can map back to the file they
      # edited, and "in practice" is not a guarantee. This names the real
      # file, costs a second, and runs before the forty-minute Owl build
      # rather than after it. desk/dune does the same with EXP-A01's two
      # manifests (research_manifests.ml, for /api/research/evidence), so its
      # delimiters are read too, and every research/experiments/*/manifest.*.json
      # is searched beside web/ -- by glob, so a manifest a later experiment
      # commits is covered without this step naming it, and an empty glob
      # fails rather than searching nothing.
      #
      # The pattern list is derived from lib/dune itself, not retyped by hand
      # here: lib/dune currently defines four such delimiters (the fourth,
      # {ohcamel_build|...}, wraps the build stamp's env-sourced strings, and
      # is included even though it cannot be reached from web/ or
      # docs/crisis/, so a fifth delimiter added anywhere in lib/dune is
      # guarded automatically instead of silently unguarded). And the check
      # only trusts grep's two documented outcomes — 0 (found, so fail loud
      # naming the file) and 1 (not found, so pass) — because a grep exit
      # code of 2 (a missing or unreadable directory, e.g. web/ absent from
      # the checkout) means the check itself never ran, which is not the same
      # thing as a clean pass and must not be reported as one.
      #
      # One platform is enough, for the same reason the format check is Linux
      # only: the answer does not depend on the OS.
      - name: No stray quoted-string delimiters in the embedded sources
        if: runner.os == 'Linux'
        run: |
          # GitHub runs an unqualified `run:` block as `bash -eo pipefail`, so a
          # bare `var=$(cmd)` assignment whose command fails (grep exiting 1 for
          # "no match", or 2 for "no such directory") kills the step right there,
          # before its exit status can be read -- silently, since -e prints
          # nothing of its own. Both fallible assignments below are therefore the
          # left side of an explicit `... && status=0 || status=$?` (or `|| true`
          # for the one whose value, not status, is what matters), so -e sees a
          # command whose failure is being tested rather than left to propagate.
          patterns=$(grep -ho '|ohcamel_[a-z_]*}' lib/dune desk/dune | sort -u) || true
          if [ -z "$patterns" ]; then
            echo "no {ohcamel_*|...|ohcamel_*} delimiters found in lib/dune -- the rule moved, or the delimiters were renamed, and this check has nothing left to guard."
            exit 1
          fi
          shopt -s nullglob
          manifests=(research/experiments/*/manifest.*.json)
          shopt -u nullglob
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "no research/experiments/*/manifest.*.json in the checkout -- desk/dune embeds them, so this check would search nothing."
            exit 1
          fi
          matches=$(grep -rnF -f <(printf '%s\n' "$patterns") web docs/crisis "${manifests[@]}") && status=0 || status=$?
          case "$status" in
            0)
              echo "$matches"
              echo "a closing quoted-string delimiter appears in an embedded source."
              echo "rename it, or change the delimiter in lib/dune or desk/dune."
              exit 1
              ;;
            1)
              echo "no stray delimiters in web/, docs/crisis/ or the ${#manifests[@]} committed manifests"
              ;;
            *)
              echo "grep failed (exit $status) — the check did not run"
              exit 1
              ;;
          esac

      # Invariant 6, as a grep. dune refuses lib/ depending on the desk
      # library, because that would be a cycle; it does not refuse a pasted
      # string. The risk kernel may not name the trading host, the orders
      # path, the journal's database binding or the desk library, and grep's
      # exit code is trusted only for its two documented outcomes -- 0 found,
      # 1 not found -- because 2 means the check never ran.
      - name: The risk kernel names nothing that trades
        if: runner.os == 'Linux'
        run: |
          matches=$(grep -rnE 'paper-api\.alpaca\.markets|/v2/orders|Sqlite3|ohcamel_desk' lib) && status=0 || status=$?
          case "$status" in
            0) echo "$matches"; echo "lib/ names something that trades; it belongs in desk/."; exit 1 ;;
            1) echo "lib/ names nothing that trades" ;;
            *) echo "grep failed (exit $status) -- the check did not run"; exit 1 ;;
          esac

      # Owl links against OpenBLAS. The Makefile's OWL_CFLAGS/OWL_LDLIBS
      # workarounds are deliberately NOT exported on Linux: they exist because
      # Apple clang segfaults compiling Owl's C stubs above -O1, which is a
      # macOS-only compiler bug. gcc builds Owl at its own -O3 fine.
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopenblas-dev liblapacke-dev \
                                  libffi-dev libssl-dev libsqlite3-dev

      - name: System dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install pkg-config openblas libomp sqlite

      # Written into GITHUB_ENV rather than the job's `env:` block because
      # these must apply to exactly one leg of the matrix, and `env:` has no
      # conditional form. The values are copied from the Makefile; if they ever
      # diverge, this leg stops testing the thing it exists to test.
      - name: Owl workarounds (macOS only — see the Makefile for why)
        if: runner.os == 'macOS'
        run: |
          echo "OWL_CFLAGS=-g -O1 -funroll-loops -fno-math-errno -fno-rounding-math -fno-signaling-nans -fexcess-precision=fast -DSFMT_MEXP=19937 -fno-strict-aliasing" >> "$GITHUB_ENV"
          echo "OWL_LDLIBS=-lm -L/opt/homebrew/opt/libomp/lib -lomp" >> "$GITHUB_ENV"

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true

      - name: Install dependencies
        run: opam install --deps-only --with-test -y .

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest --force

      # The credential-free modes, end to end. `make test` covers the units;
      # this covers the six things a reader is actually told to run, and it is
      # the step that would catch a committed crisis cache going missing or a
      # printf format string that only fails at run time.
      - name: The credential-free modes run
        run: |
          opam exec -- dune exec bin/main.exe -- synthetic > /dev/null
          opam exec -- dune exec bin/main.exe -- stress > /dev/null
          opam exec -- dune exec bin/main.exe -- backtest > /dev/null
          opam exec -- dune exec bin/main.exe -- backtest-crisis > /dev/null
          opam exec -- dune exec bin/main.exe -- options > /dev/null
          opam exec -- dune exec bin/main.exe -- garch > /dev/null

      # One platform is enough: ocamlformat's output does not depend on the OS,
      # so a second run would only cost minutes and tell you the same thing.
      - name: Format check
        if: runner.os == 'Linux'
        run: |
          opam install -y ocamlformat.0.29.0
          opam exec -- dune build @fmt

  # Benchmarks, on demand only.
  #
  # Never on push or PR. A shared runner's timings are noise -- the hardware is
  # unspecified, the neighbours are unknown, and a 3x swing between runs would
  # turn a green build red for reasons that have nothing to do with the code.
  # The README quotes a local run and names the machine.
  #
  # This job exists so the benchmark is proven to still COMPILE and RUN, which
  # is the part that rots silently. Its numbers are for reading, not gating.
  bench:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopenblas-dev liblapacke-dev \
                                  libffi-dev libssl-dev libsqlite3-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install --deps-only --with-test -y .
          opam install -y core_bench

      - name: Run
        run: |
          {
            echo '### Benchmarks (shared runner — indicative only)'
            echo '```'
            opam exec -- dune exec bench/bench_graph.exe
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  coverage:
    # Separate from the matrix because instrumentation changes what is compiled,
    # and the build whose tests everyone reads should not be the instrumented
    # one. Linux only — coverage is a property of the tests, not the platform.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libopenblas-dev liblapacke-dev \
                                  libffi-dev libssl-dev libsqlite3-dev

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install --deps-only --with-test -y .
          opam install -y bisect_ppx

      - name: Measure
        run: |
          mkdir -p _coverage
          BISECT_FILE=$PWD/_coverage/ohcamel \
            opam exec -- dune runtest --force --instrument-with bisect_ppx
          opam exec -- bisect-ppx-report html \
            --coverage-path _coverage -o _coverage/html
          opam exec -- bisect-ppx-report summary --per-file \
            --coverage-path _coverage | tee _coverage/summary.txt

      - name: Report
        run: |
          {
            echo '### Coverage'
            echo '```'
            cat _coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A floor, not a target, and the number it floors is bimodal. README.md's
      # per-file table is where that shape is set out and kept current; this
      # comment deliberately carries no more of it than the two bounds that
      # docs/status.md and the Makefile also state, because a fifth copy of the
      # table would be a fifth thing to re-measure. What it does have to do is
      # agree with them about what the two modes ARE.
      #
      # The split sits at 80% of each file's unrounded figure. The six files
      # that perform network IO themselves run 36% to 65%, because exercising
      # them means mocking a broker, which raises the number and establishes
      # nothing. Below those six is not more IO: it is derived
      # sexp_of/compare/equal boilerplate on record and variant types, which is
      # almost all of what the lowest file in the table -- desk/venue.ml, at
      # 13% -- actually is.
      #
      # The floor exists so that deleting tests is noticed; chasing the number
      # upward against a mocked feed would make it go up and mean less.
      - name: Coverage floor
        run: |
          percent=$(opam exec -- bisect-ppx-report summary --coverage-path _coverage \
                    | grep -oE '[0-9]+\.[0-9]+%' | tr -d '%')
          echo "measured ${percent}%"
          awk -v p="$percent" 'BEGIN { exit !(p >= 60) }' \
            || { echo "coverage ${percent}% is below the 60% floor"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: _coverage/html

  research-test:
    # The research layer (research/) is a separate uv project over `fdq`, not
    # gated by the opam switch the jobs above use. Ubuntu only: the answer
    # does not depend on the OS, and this job needs no OCaml toolchain at all.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.4"

      # --locked (inside the target) refuses to run if research/uv.lock has
      # drifted from pyproject.toml, rather than silently re-resolving it --
      # so a stale lockfile fails loudly here instead of only on someone's
      # machine.
      - name: research-test
        run: make research-test

      # is_stale proves a manifest names the bytes it hashed; nothing else
      # proves its numbers are what those bytes produce. This re-runs the
      # battery for every experiment on a temporary copy of the commit and
      # fails if any committed manifest differs once ran_at is masked (and,
      # off the machine the evidence was run on, python_version and a
      # float's last digits -- tools/reproduce_manifests.py says why and
      # prints what moved). Offline, no credential; about 26 s an experiment.
      - name: The committed manifests reproduce
        run: make research-reproduce
